name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # The suite runs twice: on SQLite (local/CI default) and on PostgreSQL (production).
      # Without this, the dialect that actually ships is only exercised by the first request
      # that reaches production.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumart_test
          POSTGRES_USER: edumart
          POSTGRES_PASSWORD: edumart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumart -d edumart_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Verify the OpenAPI contract matches the router
        working-directory: .
        run: python3 scripts/check-contract.py
      - name: Vet
        run: go vet ./...
      - name: Test (SQLite — the default local/CI engine)
        # A failing test has to be readable from the pull request, not only from a log somebody may not be
        # able to download. On failure the failing blocks are re-emitted as check annotations.
        run: |
          set +e
          go test ./... -race -count=1 2>&1 | tee /tmp/sqlite-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 scripts/ci-annotate.py /tmp/sqlite-test.log
            exit "$status"
          fi
      - name: Test (PostgreSQL — the production engine)
        env:
          EDUMART_TEST_POSTGRES_DSN: postgres://edumart:edumart@localhost:5432/edumart_test?sslmode=disable
        run: |
          set +e
          go test ./... -race -count=1 2>&1 | tee /tmp/postgres-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 ../scripts/ci-annotate.py /tmp/postgres-test.log
            exit "$status"
          fi
      - name: Build
        run: go build -o /tmp/edumart-api ./cmd/api

  security:
    # "We believe our dependencies are clean" is not a control. This job is what turns it into one, and
    # it is separate from the others so a stale advisory cannot be mistaken for a test failure.
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the secret detector still detects
        # A scanner that has never been shown a secret is a scanner nobody should trust, so the pattern
        # fixtures are asserted before the tree is scanned.
        run: python3 scripts/scan-secrets.py --self-test
      - name: Scan the tree for committed secrets
        run: python3 scripts/scan-secrets.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Scan Go dependencies for known vulnerabilities
        working-directory: apps/api
        # govulncheck reports only vulnerabilities reachable from this code, using the Go vulnerability
        # database. Exit code 3 means a reachable advisory, which is exactly a merge blocker.
        # govulncheck decides which standard-library fixes apply from the `go` directive in go.mod, so
        # that line is the version that must be current — a stale toolchain silently widens the blast
        # radius of every advisory ever filed against net/http.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          OUT=$("$(go env GOPATH)/bin/govulncheck" -json ./... 2>/dev/null)
          CODE=$?
          echo "$OUT" | python3 ../../scripts/summarise-vulns.py
          exit $CODE
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Scan JavaScript dependencies for known vulnerabilities
        # Production dependencies only: a vulnerable test runner cannot be reached by a learner, and
        # failing on one would push people to skip the gate entirely.
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck shared
        run: npm run typecheck --workspace @edumart/shared
      - name: Typecheck web
        run: npm run typecheck --workspace @edumart/web
      - name: Unit tests
        run: npm run test --workspace @edumart/web
      - name: Build
        run: npm run build --workspace @edumart/web
        env:
          EDUMART_API_URL: http://127.0.0.1:8080

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - name: Install Expo dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Bundle the app (Android + iOS + web)
        run: |
          npx expo export --platform android --output-dir /tmp/export-android
          npx expo export --platform ios --output-dir /tmp/export-ios
          npx expo export --platform web --output-dir /tmp/export-web

  restore-drill:
    name: Restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumart_restore
          POSTGRES_USER: edumart
          POSTGRES_PASSWORD: edumart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumart -d edumart_restore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Install PostgreSQL 17 client tools
        # pg_dump refuses to talk to a newer server, so the client has to match the service image.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Destroy both databases and restore them
        env:
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          python3 scripts/restore-drill.py both \
            --dsn 'postgres://edumart:edumart@localhost:5432/edumart_restore?sslmode=disable'
      - name: Prove the backup strategy, not just one restore
        # A restore proves the system can recover. This proves the *backups* are worth keeping: a live
        # snapshot restores completely, one flipped byte is refused, retention cannot delete the only
        # copy, and the off-site copy is byte-identical.
        env:
          PGBIN: /usr/lib/postgresql/17/bin
          EDUMART_PG_DSN: postgres://edumart:edumart@localhost:5432/edumart_backup?sslmode=disable
        # The report goes into annotations as well as the log: the log of a CI job is not always
        # reachable from where the failure is being read, and a drill that fails invisibly teaches people
        # to skip it.
        run: |
          set +e
          {
            psql "$EDUMART_PG_DSN" -c 'SELECT 1' >/dev/null 2>&1 || \
              psql 'postgres://edumart:edumart@localhost:5432/edumart_restore?sslmode=disable' \
                -c 'CREATE DATABASE edumart_backup'
            python3 scripts/backup-drill.py both --dsn "$EDUMART_PG_DSN"
          } > /tmp/backup-drill.log 2>&1
          CODE=$?
          cat /tmp/backup-drill.log
          if [ "$CODE" -ne 0 ]; then
            head -40 /tmp/backup-drill.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$CODE"
      - name: Prove point-in-time recovery
        # Needs server binaries, not just the client, because the drill builds its own cluster with WAL
        # archiving. Installed here rather than assumed: a skipped drill is not a demonstrated capability.
        env:
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          set +e
          {
            sudo apt-get install -y postgresql-17
            python3 scripts/pitr-drill.py
          } > /tmp/pitr-drill.log 2>&1
          CODE=$?
          cat /tmp/pitr-drill.log
          if [ "$CODE" -ne 0 ]; then
            head -40 /tmp/pitr-drill.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$CODE"

  e2e-smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumart_smoke
          POSTGRES_USER: edumart
          POSTGRES_PASSWORD: edumart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumart -d edumart_smoke"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Start API
        working-directory: apps/api
        run: |
          go build -o /tmp/edumart-api ./cmd/api
          EDUMART_DSN=/tmp/ci.db PORT=8080 /tmp/edumart-api & echo $! > /tmp/api.pid
          # Wait on readiness, not liveness: it proves the database and migrations are actually up.
          for i in $(seq 1 30); do curl -sf http://localhost:8080/readyz && break; sleep 1; done
      - name: Verify the learner journey over HTTP (SQLite)
        run: python3 scripts/smoke.py http://localhost:8080
      - name: Verify the browser session lifecycle (SQLite)
        # A three-second access token, so expiry is a fact about this run rather than something the suite
        # assumes. Proves sign-in issues a scoped refresh cookie, the cookie renews the session, sign-out kills
        # the chain, and a dead chain clears the cookies.
        run: |
          EDUMART_DSN=/tmp/ci-session.db PORT=8082 EDUMART_ACCESS_TOKEN_TTL=3s /tmp/edumart-api > /tmp/session-api.log 2>&1 &
          echo $! > /tmp/session-api.pid
          for attempt in $(seq 1 40); do
            curl -fsS http://localhost:8082/readyz > /dev/null && break
            sleep 1
          done
          python3 scripts/session-lifecycle.py --base http://localhost:8082 --ttl 3
          kill "$(cat /tmp/session-api.pid)" 2>/dev/null || true
      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/api.pid)" || true
      - name: Start API on PostgreSQL
        working-directory: apps/api
        run: |
          EDUMART_DRIVER=postgres \
          EDUMART_DSN='postgres://edumart:edumart@localhost:5432/edumart_smoke?sslmode=disable' \
          PORT=8081 /tmp/edumart-api & echo $! > /tmp/api-pg.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8081/readyz && break; sleep 1; done
      - name: Verify the learner journey over HTTP (PostgreSQL)
        run: python3 scripts/smoke.py http://localhost:8081
      - name: Stop PostgreSQL API
        if: always()
        run: kill "$(cat /tmp/api-pg.pid)" 2>/dev/null || true

  observability:
    name: Observability
    runs-on: ubuntu-latest
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Install checker dependencies
        run: pip install pyyaml
      - name: Prove the alert checker still catches a rename
        # Before trusting a green result from the checker, check the checker. This is the same principle as
        # the secret detector's own fixture: a gate that has only ever passed is not known to work.
        run: python3 scripts/check-alerts.py --self-test
      - name: Start the API
        working-directory: apps/api
        run: |
          go build -o /tmp/edumart-api ./cmd/api
          EDUMART_DSN=/tmp/ci-metrics.db PORT=8080 \
          EDUMART_BACKUP_HEARTBEAT=/tmp/heartbeat.json /tmp/edumart-api & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8080/readyz && break; sleep 1; done
      - name: Take a backup that reports a heartbeat
        # Runs the real backup tool rather than hand-writing the JSON: if the tool's output shape and the API's
        # reader ever drift apart, this step is where it shows up instead of in production at 3am.
        run: |
          python3 scripts/backup.py --engine sqlite --dsn /tmp/ci-metrics.db --dest /tmp/backups \
            --heartbeat /tmp/heartbeat.json
          python3 scripts/backup.py --engine sqlite --dsn /tmp/ci-metrics.db --dest /tmp/backups \
            --verify --heartbeat /tmp/heartbeat.json
      - name: Every alert rule must be able to fire
        run: |
          curl -sf http://localhost:8080/metrics -o /tmp/metrics.txt
          cat /tmp/metrics.txt
          python3 scripts/check-alerts.py --metrics /tmp/metrics.txt
      - name: The backup heartbeat must reach the metric the backup alerts watch
        run: |
          curl -sf http://localhost:8080/metrics -o /tmp/metrics-after-backup.txt
          grep -q '^edumart_backup_age_seconds ' /tmp/metrics-after-backup.txt \
            || { echo "::error::the backup heartbeat did not produce edumart_backup_age_seconds"; exit 1; }
          grep -q '^edumart_backup_last_run_succeeded 1' /tmp/metrics-after-backup.txt \
            || { echo "::error::a verified backup was not reported as verified"; exit 1; }
      - name: With a token configured, the scrape endpoint fails closed
        # A second instance on another port, because the token is read at startup. This is the production
        # configuration: no token, no metrics — with a 404, so a prober does not learn the endpoint exists.
        run: |
          EDUMART_DSN=/tmp/ci-metrics-token.db PORT=8082 EDUMART_METRICS_TOKEN=s3cret-scrape \
            /tmp/edumart-api & echo $! > /tmp/api-token.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8082/healthz && break; sleep 1; done
          unauthorised=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/metrics)
          wrong=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer s3cret-scrap' \
            http://localhost:8082/metrics)
          authorised=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer s3cret-scrape' \
            http://localhost:8082/metrics)
          echo "no token: $unauthorised | wrong token: $wrong | right token: $authorised"
          [ "$unauthorised" = "404" ] || { echo "::error::/metrics answered $unauthorised without a token"; exit 1; }
          [ "$wrong" = "404" ] || { echo "::error::/metrics accepted a wrong token ($wrong)"; exit 1; }
          [ "$authorised" = "200" ] || { echo "::error::/metrics refused the correct token ($authorised)"; exit 1; }
          kill "$(cat /tmp/api-token.pid)" 2>/dev/null || true
      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  load:
    name: Load and invariants
    runs-on: ubuntu-latest
    needs: [api]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumart_load
          POSTGRES_USER: edumart
          POSTGRES_PASSWORD: edumart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumart -d edumart_load"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Install PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client
      - name: Build the API and the load generator
        working-directory: apps/api
        run: |
          go build -o /tmp/edumart-api ./cmd/api
          go build -o /tmp/edumart-loadtest ./cmd/loadtest
      - name: Load both engines, then prove the invariants survived
        # The budget is deliberately loose. A tight p95 threshold on a shared CI runner measures the runner,
        # not the code, and a flaky gate gets switched off — which is worse than no gate. What this catches
        # is a real regression: an order of magnitude of latency, any 5xx under concurrency, or a broken
        # invariant, which is the half that matters.
        run: |
          python3 scripts/loadtest.py sqlite --concurrency 24 --duration 15s --warmup 3s --ramp 2s \
            --port 8099 --max-p95 400ms --max-error-rate 0.005
          python3 scripts/loadtest.py postgres \
            --dsn 'postgres://edumart:edumart@localhost:5432/edumart_load?sslmode=disable' \
            --concurrency 64 --duration 20s --warmup 4s --ramp 3s \
            --port 8101 --max-p95 400ms --max-error-rate 0.005
        env:
          EDUMART_API_BIN: /tmp/edumart-api

  deploy-rehearsal:
    # Phase 4's gap was never "we have no CI": it was "deploy and rollback are unproven". This is the proof.
    # It builds the previous release from git, deploys this one over it, writes data, then rolls *back* to
    # the previous release against the migrated database and reads that data with the old code.
    name: Deploy and rollback rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumart_rehearsal
          POSTGRES_USER: edumart
          POSTGRES_PASSWORD: edumart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumart -d edumart_rehearsal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous release is built from a git ref, so the history has to be there. A shallow clone
          # would make this job pass by having nothing to roll back to.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Install PostgreSQL client tools
        # The rehearsal drops and recreates the schema with psql before each run.
        run: sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client
      - name: Refuse migrations a rollback cannot survive
        # Fast, needs no database, and catches the one class of migration that makes a rollback impossible
        # before anybody spends four minutes proving it the hard way.
        run: python3 scripts/deploy-rehearsal.py --check-only
      - name: Deploy forward, then roll back
        env:
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          python3 scripts/deploy-rehearsal.py \
            --engine postgres \
            --dsn 'postgres://edumart:edumart@localhost:5432/edumart_rehearsal?sslmode=disable' \
            --from origin/main

  fleet:
    # A single-process test suite cannot see a race between processes. This starts six real replicas against
    # one fresh database and checks the three properties a rollout depends on: they all become ready, each
    # migration is recorded exactly once, and a replica that may not migrate stays out of rotation instead of
    # serving a schema it does not have.
    name: Fleet start
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumart_fleet
          POSTGRES_USER: edumart
          POSTGRES_PASSWORD: edumart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumart -d edumart_fleet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Install PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client
      - name: Start six replicas and prove they all come up
        env:
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          cd apps/api && go build -o /tmp/edumart-api ./cmd/api && cd -
          EDUMART_API_BIN=/tmp/edumart-api python3 scripts/fleet-start.py \
            --dsn 'postgres://edumart:edumart@localhost:5432/edumart_fleet?sslmode=disable' \
            --replicas 6

  manifests:
    # The deployment manifests are code: they are checked against the application's own environment surface,
    # and each check is shown a fault it must catch. An unchecked YAML file is a plan, not a deployment.
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the YAML parser the checker uses
        run: python3 -m pip install --quiet pyyaml
      - name: Every check must be able to fail
        run: python3 scripts/check-manifests.py --self-test
      - name: Check the manifests against the application
        run: python3 scripts/check-manifests.py --verbose
      - name: Install kubectl
        run: |
          curl -sSfL -o /tmp/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
      - name: Every object is one kubectl would accept
        # `create --dry-run=client` builds the objects locally: no cluster, no credentials, no API server. It
        # is a real check and not a formality — kubectl parses and decodes with the Kubernetes schema, so a
        # field in the wrong place or a wrong type is caught here and not at 2am during a deploy.
        run: |
          /tmp/kubectl create --dry-run=client --validate=false -o name -f infra/k8s/ 2>&1 | tee /tmp/kubectl.out
          count=$(grep -c . /tmp/kubectl.out)
          echo "$count object(s) accepted"
          test "$count" -ge 14 || (echo "expected every document to be accepted; got $count" >&2; exit 1)

  rollout:
    # "It starts" and "it can be replaced while running" are different claims. This job swaps a real fleet
    # behind a real load balancer under continuous traffic, then aborts the rollout halfway and recovers —
    # and injects a known-bad rollout first to prove the gate still fails when it should.
    name: Rolling rollout
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumart_rollout
          POSTGRES_USER: edumart
          POSTGRES_PASSWORD: edumart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumart -d edumart_rollout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Install PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client
      - name: The gate must fail when a replica joins the rotation before it is ready
        env:
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          set +e
          python3 scripts/rollout-rehearsal.py --fault early \
            --dsn 'postgres://edumart:edumart@localhost:5432/edumart_rollout?sslmode=disable'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "the rollout rehearsal passed with a broken rollout — the gate is not testing anything" >&2
            exit 1
          fi
          echo "the gate refused a replica that was in rotation before it was ready"
      - name: Replace, downgrade and abort a four-replica fleet under traffic
        env:
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          python3 scripts/rollout-rehearsal.py \
            --dsn 'postgres://edumart:edumart@localhost:5432/edumart_rollout?sslmode=disable' \
            --replicas 4

  image:
    # An untested Dockerfile is a deployment plan, not a deployment. This builds both images and runs them
    # **as one stack** against a real database, because the failures that matter here — a missing CA bundle,
    # a cgo-linked SQLite without its loader, a proxy pointed at a build-time host, a container that cannot
    # read its own files — only appear once something actually starts the image next to something else.
    name: Container images
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumart
          POSTGRES_USER: edumart
          POSTGRES_PASSWORD: edumart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumart -d edumart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: |
          docker build -f apps/api/Dockerfile \
            --build-arg VERSION="sha-${GITHUB_SHA::7}" -t edumart-api:ci apps/api
      - name: The API image runs as a non-root user
        run: |
          user=$(docker image inspect edumart-api:ci --format '{{.Config.User}}')
          echo "image user: ${user:-root}"
          test "$user" != "" && test "$user" != "root" && test "$user" != "0"
      - name: Build the web image, with no API address baked in
        run: docker build -f apps/web/Dockerfile -t edumart-web:ci .
      - name: The web image runs as a non-root user
        run: |
          user=$(docker image inspect edumart-web:ci --format '{{.Config.User}}')
          echo "image user: ${user:-root}"
          test "$user" != "" && test "$user" != "root" && test "$user" != "0"
      - name: Start the stack the way the manifests describe it
        # One user-defined network with DNS, so the web container reaches the API by *name* — the same thing
        # a Service does in-cluster. `host.docker.internal` is how the containers reach the job's PostgreSQL
        # service, which listens on the runner's loopback.
        run: |
          docker network create edumart-ci
          docker run -d --name edumart-api --network edumart-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 \
            -e EDUMART_DRIVER=postgres \
            -e EDUMART_DSN='postgres://edumart:edumart@host.docker.internal:5432/edumart?sslmode=disable' \
            -e EDUMART_ENV=production \
            -e EDUMART_SEED=true \
            -e EDUMART_SEED_DEMO_USERS=true \
            -e EDUMART_NOTIFY=log \
            -e EDUMART_VERIFICATION_SECRET=ci_only_verification_secret_value \
            -e EDUMART_ALLOWED_ORIGINS=http://localhost:3000 \
            -e EDUMART_TRUST_PROXY=true \
            -e EDUMART_ACCESS_TOKEN_TTL=5s \
            edumart-api:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz > /tmp/readyz.json; then break; fi
            sleep 2
          done
          cat /tmp/readyz.json
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/readyz.json"))
          assert body["status"] == "ok", body
          assert body["version"].startswith("sha-"), body
          assert {c["name"] for c in body["checks"]} >= {"database", "migrations"}, body
          print("the API container is ready and identifies itself as", body["version"])
          PY
          docker run -d --name edumart-web --network edumart-ci \
            -p 3000:3000 \
            -e EDUMART_API_URL=http://edumart-api:8080 \
            -e NODE_ENV=production \
            edumart-web:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/manifest.webmanifest > /dev/null; then break; fi
            sleep 2
          done
      - name: The web container serves pages, proxies /v1, and passes a session through
        run: |
          echo "--- a server-rendered page:"
          curl -fsS -o /dev/null -w "%{http_code} GET /\n" http://127.0.0.1:3000/
          echo "--- through the proxy, which was pointed at the API at run time:"
          curl -fsS http://127.0.0.1:3000/v1/subjects > /tmp/subjects.json
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/subjects.json"))
          assert body["subjects"], body
          print(f"the proxy returned {len(body['subjects'])} subjects from the API container")
          PY
          echo "--- an authenticated route without a session still reaches the API:"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/v1/me)
          test "$code" = "401" || (echo "expected 401 from the API through the proxy, got $code" >&2; exit 1)
          echo "--- and a login through the proxy sets the session cookie on the web origin:"
          curl -s -D /tmp/login.headers -o /dev/null \
            -X POST http://127.0.0.1:3000/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"student@edumart.ng","password":"Student123!"}'
          grep -iq '^set-cookie: edumart_session=' /tmp/login.headers || \
            (echo "no session cookie came back through the proxy" >&2; cat /tmp/login.headers; exit 1)
          echo "session cookie passed through with its HttpOnly attributes:"
          grep -i '^set-cookie:' /tmp/login.headers
      - name: The web container renews an expired session by itself
        # The whole point of the middleware, in one command: a real cookie jar, an access token that has really
        # expired, and a page navigation that must still render. Before this existed the web app kept a
        # seven-day access cookie and the refresh path was never exercised by any browser.
        run: |
          python3 scripts/session-lifecycle.py --base http://127.0.0.1:3000 --via-web --ttl 5
      - name: Both container logs on failure
        if: failure()
        run: docker logs edumart-web || true; docker logs edumart-api || true
