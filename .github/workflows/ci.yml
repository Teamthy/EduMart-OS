name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./db/ci.db
      SESSION_TTL_HOURS: "168"
      PAYMENT_WEBHOOK_SECRET: ci_only_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Start server and smoke test the API
        run: |
          npm start &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/v1/exam-pathways > /dev/null; then break; fi
            sleep 1
          done
          curl -sf -c cookies.txt -X POST http://localhost:3000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"student@edumart.ng","password":"Student123!"}' > /dev/null
          curl -sf -b cookies.txt http://localhost:3000/api/v1/me | grep -q "student@edumart.ng"
          curl -sf -b cookies.txt http://localhost:3000/api/v1/me/learning-summary > /dev/null
          echo "smoke test passed"
