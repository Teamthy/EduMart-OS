openapi: 3.1.0
info:
  title: Edumart API
  version: 1.0.0
  description: |
    The contract both clients build against. `apps/web` and `apps/mobile` consume these endpoints;
    neither re-implements deadlines, scoring, authorisation, payment confirmation or rewards.

    Conventions that are not optional:

    - Every error uses one envelope: `{ "error": { code, message, request_id, details } }`.
    - Money is an integer number of minor units plus an ISO-4217 currency. Never a float.
    - Timestamps are ISO-8601 UTC with a `Z` suffix. Deadlines come from the server; a client clock
      is display-only.
    - Answer writes carry `expectedVersion` and `clientSequence`; a replayed write returns the same
      version, a stale one returns `409 CONFLICT` with `details.current_version`.
    - Answer keys and explanations are absent from every response until `result_released` is true.
    - Payment truth comes only from `POST /webhooks/payments/{provider}` with a valid
      `X-Edumart-Signature`.

    Authentication is an httpOnly session cookie (web) or `Authorization: Bearer <token>`
    (native). Both resolve to the same server-side session.
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development (the web app proxies /v1 from its own origin)
  - url: https://api.edumart.ng
    description: Production

tags:
  - name: discovery
  - name: identity
  - name: signup
  - name: content
  - name: assessment
  - name: classroom
  - name: commerce
  - name: rewards
  - name: live
  - name: staff

paths:
  /healthz:
    get:
      summary: Liveness and driver in use
      description: |
        Cheap and dependency-free by design. It answers "is this process alive", never "can it serve
        traffic" — failing liveness because a dependency is down would restart a healthy process and
        turn one outage into two.
      operationId: healthz
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status, time, driver]
                properties:
                  status: { type: string, const: ok }
                  time: { type: string, format: date-time }
                  driver: { type: string, enum: [sqlite3] }

  /readyz:
    get:
      summary: Readiness — real dependency checks
      description: |
        Used by load balancers and deploy gates. Probes the database (ping plus a real read) and
        verifies that every embedded migration is applied. Returns 503 with a per-check breakdown
        when anything is wrong, so an operator learns *which* dependency failed from the body.

        `healthz` staying green while `readyz` is red is the intended signal: restarting the process
        would not help.
      operationId: readyz
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: A dependency is unavailable or the schema is out of date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /v1/auth/register:
    post:
      tags: [identity]
      summary: Create an account, completing the signup wizard
      description: |
        The only endpoint that creates an account. Earlier wizard answers live in a signup draft, so
        no partially registered account exists while the learner is on page three of five.
        Rate limited to 30 requests per minute per address.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and a session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/login:
    post:
      tags: [identity]
      summary: Authenticate
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/logout:
    post:
      tags: [identity]
      summary: Revoke the current session
      operationId: logout
      responses:
        "200": { description: Session revoked }

  /v1/auth/refresh:
    post:
      tags: [identity]
      summary: Exchange a refresh token for a new pair
      description: |
        Rotation, not extension. The presented refresh token is retired by this call, and the response
        carries its successor. Two rules follow from that:

        - **A token used twice is evidence.** Once a rotation is older than a 20-second grace window,
          presenting its token again means two parties hold it, so the entire session family is revoked
          — the caller's successor included — and the response is `401 SESSION_REUSED`. Inside the grace
          window the duplicate is refused without revocation, because two browser tabs refreshing at
          the same moment is a race, not theft.
        - **Retrying cannot help.** `SESSION_REUSED` means the user must sign in again; a client that
          retries the same token gets the same answer forever.

        Present the token in the body, or as an `edumart_refresh` cookie if the client sets one itself.
        The API never sets that cookie: a 30-day single-use credential belongs in the client's secure
        storage, not in a cookie that every request to the origin carries.
      operationId: refreshSession
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional when the `edumart_refresh` cookie is present.
      responses:
        "200":
          description: A new token pair; the presented refresh token is now dead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionIssued" }
        "401":
          description: The token is unknown, expired, revoked, already rotated, or the account is suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/password/forgot:
    post:
      tags: [identity]
      summary: Request a reset token
      description: Always answers 200 so the endpoint cannot be used to enumerate accounts.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Accepted }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password/reset:
    post:
      tags: [identity]
      summary: Set a new password from a reset token
      description: Invalidates every existing session for the account.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, writeOnly: true }
      responses:
        "200": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationError" }

  /v1/auth/verification/request:
    post:
      tags: [identity]
      summary: Send a verification code
      description: |
        Sends a six-digit code to the account's email address, or to a phone number supplied with the
        request (stored unverified first, normalised to E.164). The code itself is never returned and
        never logged outside development; the response only says where it went, masked.

        Throttled per user and channel: one code per 60 seconds, five per hour. A code that fails to
        deliver is discarded rather than left valid.
      operationId: requestVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [email, phone] }
                phone:
                  type: string
                  description: Required the first time a phone is verified. Local numbers such as 0803 123 4567 are normalised.
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  channel: { type: string, enum: [email, phone] }
                  destination:
                    type: string
                    description: Masked, for recognising which address or number was used.
                  expires_at: { type: string, format: date-time }
                  resend_after: { type: integer, description: Seconds before another code may be requested }
                  attempts_allowed: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { description: Too many codes requested }

  /v1/auth/verification/confirm:
    post:
      tags: [identity]
      summary: Confirm a verification code
      description: |
        Checks the newest live code for the channel and, on success, records proof of ownership.
        A code is single-use, expires after 15 minutes, and is spent after five wrong attempts.
        Every failure returns the same validation shape, so the response never reveals whether a
        code existed.
      operationId: confirmVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, code]
              properties:
                channel: { type: string, enum: [email, phone] }
                code: { type: string, description: Six digits, as sent }
      responses:
        "200":
          description: Channel verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  channel: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/signup-drafts:
    post:
      tags: [signup]
      summary: Start a signup draft
      description: Returns an opaque token; the web app stores it in an httpOnly cookie.
      operationId: createSignupDraft
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                referralCode: { type: string }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupDraftResponse"

  /v1/signup-drafts/current:
    get:
      tags: [signup]
      summary: Read the draft for this visitor
      description: |
        Server-persisted wizard progress. This is what makes the flow resumable across a refresh,
        a different device, or the other client.
      operationId: getSignupDraft
      security: []
      responses:
        "200":
          description: Current draft, or nulls when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupDraftResponse"
    patch:
      tags: [signup]
      summary: Write answers for the current step
      operationId: updateSignupDraft
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentStep:
                  type: string
                  enum: [pathway, subjects, schedule, account, confirm]
                examPathwayKey: { type: string }
                examPathwayId: { type: string }
                subjectIds:
                  type: array
                  items: { type: string }
                targetDate: { type: string, format: date }
                dailyMinutes: { type: integer, minimum: 5, maximum: 600 }
                displayName: { type: string }
                email: { type: string, format: email }
                referralCode: { type: string }
                timezone: { type: string }
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupDraftResponse"
        "400": { $ref: "#/components/responses/ValidationError" }

  /v1/me:
    get:
      tags: [identity]
      summary: The signed-in user and their roles
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [identity]
      summary: Update profile settings
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                targetDate: { type: string, format: date }
                dailyMinutes: { type: integer }
                timezone: { type: string }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/sessions:
    get:
      tags: [identity]
      summary: Active sessions (devices) for the caller
      description: |
        Expired and revoked sessions are omitted. `id` is the stored session key — a hash of the
        token — so it can be used to revoke a session but cannot be replayed as credentials.
      operationId: listSessions
      responses:
        "200":
          description: Live sessions, newest first, exactly one marked current
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/sessions/{id}:
    delete:
      tags: [identity]
      summary: Revoke one of the caller's sessions
      description: |
        Scoped to the caller by user id in the query itself, so a session id from another account
        cannot be used to sign somebody else out (404, not 403 — the id is not confirmed to exist).
        Revoking the current session is allowed and ends it.
      operationId: revokeSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
                  wasCurrent: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/exam-pathways:
    get:
      tags: [content]
      summary: Exam pathways available to a new learner
      operationId: listExamPathways
      security: []
      responses:
        "200":
          description: Pathways
          content:
            application/json:
              schema:
                type: object
                properties:
                  pathways:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        key: { type: string }
                        name: { type: string }
                        body: { type: string }
                        blurb: { type: string }
                        subjects: { type: integer }

  /v1/subjects:
    get:
      tags: [content]
      summary: Subjects
      operationId: listSubjects
      security: []
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjects:
                    type: array
                    items: { $ref: "#/components/schemas/Subject" }

  /v1/subjects/{subjectId}/topics:
    get:
      tags: [content]
      summary: Topics for a subject
      operationId: listTopics
      security: []
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200": { description: Topics }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/referrals/validate/{code}:
    get:
      tags: [rewards]
      summary: Check a referral code before it is submitted
      operationId: validateReferralCode
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  referrerName: { type: string }

  /v1/dashboard:
    get:
      tags: [content]
      summary: Learner home read model
      operationId: getDashboard
      responses:
        "200": { description: Dashboard }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/learning-summary:
    get:
      tags: [content]
      summary: Derived progress by topic
      description: Rebuilt from submitted responses; never self-reported and never the source of a score.
      operationId: getLearningSummary
      responses:
        "200": { description: Summary }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/study-plan:
    get:
      tags: [content]
      summary: Current study plan
      operationId: getStudyPlan
      responses:
        "200": { description: Plan }
    put:
      tags: [content]
      summary: Save the study plan
      operationId: saveStudyPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dailyMinutes: { type: integer }
                days:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Saved }

  /v1/practice-sessions:
    post:
      tags: [assessment]
      summary: Start an untimed practice attempt
      description: |
        The session snapshot is frozen here: questions, options and the scoring policy version are
        copied into the attempt, so a later content edit cannot change a past score.
      operationId: startPractice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId]
              properties:
                subjectId: { type: string }
                topicIds:
                  type: array
                  items: { type: string }
                count: { type: integer, minimum: 1, maximum: 50, default: 10 }
                difficulty: { type: string, enum: [easy, medium, hard] }
      responses:
        "201":
          description: Attempt created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssessmentSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/assessment-definitions/{id}/sessions:
    post:
      tags: [assessment]
      summary: Start a graded assessment
      description: |
        Class membership, publication state, availability window and attempt limit are all checked
        server-side. Graded attempts are immutable once submitted.
      operationId: startAssessment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Attempt created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssessmentSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Attempt limit reached or assessment closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/assessment-sessions:
    get:
      tags: [assessment]
      summary: Attempt history
      operationId: listAttempts
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: History }

  /v1/assessment-sessions/{id}:
    get:
      tags: [assessment]
      summary: One attempt, with the review only when results are released
      operationId: getAttempt
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssessmentSession" }
        "403":
          description: Someone else's attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/assessment-sessions/{id}/responses/{qvId}:
    put:
      tags: [assessment]
      summary: Save an answer
      description: |
        Idempotent and version-checked. The server decides whether the attempt is still open; the
        client countdown is display-only. A lost response is retried with the same
        `clientSequence`, which returns the stored version rather than writing twice.
      operationId: saveResponse
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/QuestionVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedOptionId:
                  type: [string, "null"]
                expectedVersion:
                  type: integer
                  minimum: 0
                clientSequence:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Saved (or replayed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "409":
          description: |
            `CONFLICT` with `details.current_version` when the answer changed elsewhere;
            `SESSION_EXPIRED` or `SESSION_CLOSED` when the attempt can no longer accept writes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/assessment-sessions/{id}/corrections/{qvId}:
    put:
      tags: [assessment]
      summary: Correct a practice answer after submission
      description: |
        Practice only. A graded assessment is evidence: the released key cannot be used to rewrite
        its score, so this returns 409 for graded attempts. The response carries the new answer
        version and nothing else — no correctness, no score — so it cannot act as an answer oracle.
      operationId: correctResponse
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/QuestionVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedOptionId: { type: string }
                expectedVersion: { type: integer }
                clientSequence: { type: integer }
      responses:
        "200":
          description: Rescored from stored responses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "409":
          description: Closed, graded, or stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/assessment-sessions/{id}/submit:
    post:
      tags: [assessment]
      summary: Submit and score
      description: Idempotent — submitting twice cannot double-award learning points.
      operationId: submitAttempt
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Final attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssessmentSession" }

  /v1/assessment-sessions/{id}/cancel:
    post:
      tags: [assessment]
      summary: Abandon an attempt
      operationId: cancelAttempt
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Cancelled }
        "409":
          description: Already closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/organizations:
    get:
      tags: [institutions]
      summary: Organisations the caller belongs to
      description: Each entry carries the caller's own membership role, so the list doubles as "what may I do here".
      operationId: listOrganizations
      responses:
        "200": { description: Organisations }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [institutions]
      summary: Register an organisation
      description: |
        The caller becomes the organisation's owner — scoped to that organisation and recorded as an
        auditable membership. No platform-wide role is granted: authority inside an institution comes
        from membership, never from a role chosen at signup.

        The organisation starts `pending_verification` and a platform administrator approves it. A
        verified email is required, because there must be a reachable person responsible for it.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3 }
                kind: { type: string, enum: [school, centre, ngo, company], default: school }
      responses:
        "201":
          description: Organisation created, unverified
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The caller's email address is not verified (`EMAIL_NOT_VERIFIED`)

  /v1/organizations/{id}:
    get:
      tags: [institutions]
      summary: One organisation
      description: Members only. A non-member receives 404 rather than 403, so the endpoint cannot be used to enumerate organisations.
      operationId: getOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organisation
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organizations/{id}/classes:
    get:
      tags: [organizations]
      summary: An institution's classes
      description: |
        Owner or administrator only. Belonging to an institution is not the same as running it, so a
        student member gets `403`.

        Only classes explicitly created inside the institution appear here: a teacher's personal class
        is theirs, not the institution's, whatever their employment.
      operationId: listOrganizationClasses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Institution classes with member and assignment counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items: { $ref: "#/components/schemas/Class" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organizations/{id}/report:
    get:
      tags: [organizations]
      summary: Institution dashboard
      description: |
        Owner or administrator only; a teacher gets `403`, a non-member `404`.

        Everything is counted inside a 30-day window and scoped to this organisation inside the SQL
        itself, so no number in this response can describe another institution's learners.

        `results.averageScorePercent` and each class's `averageScorePercent` are `null` when nothing has
        been submitted. That is deliberate: `0` would be a claim about performance, `null` is the absence
        of data.
      operationId: getOrganizationReport
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The institution's members, teaching load and recent results
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    type: object
                    required: [organizationId, generatedAt, windowDays, members, teaching, results, classes]
                    properties:
                      organizationId: { type: string }
                      generatedAt: { type: string, format: date-time }
                      windowDays: { type: integer }
                      members:
                        type: object
                        required: [total, owners, admins, teachers, students]
                        properties:
                          total: { type: integer }
                          owners: { type: integer }
                          admins: { type: integer }
                          teachers: { type: integer }
                          students: { type: integer }
                      teaching:
                        type: object
                        required: [classes, assignments]
                        properties:
                          classes: { type: integer }
                          assignments:
                            type: integer
                            description: Published assessments attached to the institution's classes; drafts are not counted.
                      results:
                        type: object
                        required: [activeLearners, submissions, averageScorePercent]
                        properties:
                          activeLearners:
                            type: integer
                            description: Members who submitted at least one assessment in the window.
                          submissions: { type: integer }
                          averageScorePercent:
                            type: integer
                            nullable: true
                      classes:
                        type: array
                        items:
                          type: object
                          required: [id, name, members, assignments, submissions, averageScorePercent]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            members: { type: integer }
                            assignments: { type: integer }
                            submissions: { type: integer }
                            averageScorePercent:
                              type: integer
                              nullable: true
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organizations/{id}/members:
    get:
      tags: [institutions]
      summary: Membership roster
      description: Owners and administrators only — a roster contains other people's contact details.
      operationId: listOrganizationMembers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organizations/{id}/members/{userId}:
    delete:
      tags: [institutions]
      summary: Remove a member (or leave)
      description: |
        Ends the membership and, in the same transaction, the access it carried — including the global
        teacher role when no other organisation still grants it. An administrator cannot remove a peer
        or a superior; anyone may leave on their own behalf. The last owner cannot be removed.
      operationId: removeOrganizationMember
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Membership ended }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The organisation would be left without an owner

  /v1/organizations/{id}/invitations:
    get:
      tags: [institutions]
      summary: Invitations issued by an organisation
      description: Owners and administrators. Tokens are never listed — only the state of each invitation.
      operationId: listOrganizationInvitations
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [institutions]
      summary: Invite someone into an organisation
      description: |
        Creates a single-use, email-locked invitation valid for seven days and returns its token once.
        The token is stored as a hash, so a database reader cannot use one. Any earlier open invitation
        for the same address is superseded. Ownership is never invitable.
      operationId: createOrganizationInvitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, teacher, student], default: teacher }
      responses:
        "201":
          description: Invitation created; the token is returned only here
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  token:
                    type: string
                    description: Opaque invitation token. Deliver it; do not log or store it client-side.
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: That person is already a member }

  /v1/organizations/{id}/invitations/{invitationId}:
    delete:
      tags: [institutions]
      summary: Withdraw an invitation
      description: The link stops working immediately. Distinct from expiry, which happens on its own.
      operationId: revokeOrganizationInvitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Invitation withdrawn }
        "404": { description: No open invitation with that id }

  /v1/organizations/invitations/accept:
    post:
      tags: [institutions]
      summary: Accept an invitation
      description: |
        The token must be live, have uses left, and have been addressed to the signed-in account.
        A teacher invitation is a deliberate grant by an owner, so it confers the platform teacher role;
        admin and student invitations confer nothing global.
      operationId: acceptOrganizationInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined: { type: boolean }
                  organization: { $ref: "#/components/schemas/Organization" }
        "403": { description: The invitation was addressed to a different account }
        "404": { description: The token is not valid }
        "409": { description: Already used, revoked or expired }

  /v1/admin/organizations/{id}/verify:
    post:
      tags: [institutions]
      summary: Approve an organisation
      description: Platform administrators only. An institution vouching for itself is not verification.
      operationId: verifyOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already verified }

  /v1/classes:
    get:
      tags: [classroom]
      summary: Classes this user belongs to
      operationId: listClasses
      responses:
        "200": { description: Classes }
    post:
      tags: [classroom]
      summary: Create a class
      description: |
        Two permissions reach this endpoint, and they are deliberately different.

        A **personal** class (no `organizationId`) needs a teaching capability: the caller must hold the
        `teacher`, `org_admin` or `platform_admin` role.

        An **institution** class needs authority inside that institution — an `owner` or `admin`
        membership. A principal who has never taught may create their school's classes; a teacher who
        belongs to another institution may not, and is told the institution was not found rather than
        being told it exists.
      operationId: createClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                subjectId: { type: string }
                organizationId:
                  type: string
                  description: Attach the class to an institution. The caller must own or administer it.
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/join:
    post:
      tags: [classroom]
      summary: Join a class with a code
      operationId: joinClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      description: |
        Codes are six characters, case-insensitive. An expired code returns `410 JOIN_CODE_EXPIRED`
        rather than `404`: the remedy is "ask your teacher for the current code", not "retype this one".
      responses:
        "200": { description: Joined }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The code is real but its window has passed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/classes/{id}/join-code:
    post:
      tags: [classroom]
      summary: Reissue a class join code
      description: |
        The teacher who runs the class, a teacher in it, an administrator of the institution that owns
        it, or platform staff. A learner in the class gets `403`: whoever can rotate the code can hand out
        access to their own classroom.

        Rotation replaces the code rather than adding a second one, so the previous code stops working the
        moment this returns — that is the point of rotating it. The new code is six characters drawn from
        a cryptographic source, and its window is 30 days from now.
      operationId: rotateClassJoinCode
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The class with its new code and expiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  class: { $ref: "#/components/schemas/Class" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/{id}/roster:
    get:
      tags: [classroom]
      summary: Class roster
      description: Teacher of that class, or a platform admin. Never "any staff member".
      operationId: classRoster
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Roster }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/classes/{id}/assignments:
    get:
      tags: [classroom]
      summary: Published assessments for a class
      operationId: classAssignments
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Assignments }

  /v1/products:
    get:
      tags: [commerce]
      summary: Store products
      operationId: listProducts
      responses:
        "200":
          description: Products with integer minor-unit prices
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }

  /v1/search:
    get:
      tags: [discovery]
      summary: Search the catalogue and the syllabus
      description: |
        Public, like the taxonomy: somebody deciding whether to sign up should be able to check whether
        the thing they want exists.

        Matching is **prefix-based on a token index**, not substring search, so "alg" finds "Algebra" and
        "aljebra" finds nothing. Every term must match — two words are a narrower question, not an either/or —
        and the response echoes `terms` so a confusing result can be explained rather than guessed at.

        Ranking is: a title match (3) beats a subtitle match (2), which beats a body mention (1), plus 5 for
        an exact title. Order is stable and total; the same query twice returns the same order.

        Results are filtered against the source tables at query time, so an unpublished product, a
        deactivated subject or a topic belonging to a deactivated subject can never appear, however stale the
        index has become.
      operationId: search
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: What to look for. An empty or stopword-only query returns zero results, not an error.
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          required: false
          description: Restrict to one kind of result.
          schema: { type: string, enum: [all, product, subject, topic], default: all }
        - name: limit
          in: query
          required: false
          description: Page size. Values above 50 are clamped to 50 rather than refused.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Ranked results, plus the terms the server actually searched for
          content:
            application/json:
              schema:
                type: object
                required: [query, terms, results, count, took_ms]
                properties:
                  query: { type: string }
                  terms:
                    type: array
                    items: { type: string }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                  count: { type: integer }
                  took_ms: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"

  /v1/admin/search/reindex:
    post:
      tags: [staff]
      summary: Rebuild the search projection
      description: |
        Rebuilds the whole index from the source tables in one transaction, so it is safe to call
        repeatedly and never leaves a half-built index behind. Full rebuild rather than incremental
        updates on purpose: an incremental path that misses one write site is a bug nobody reports as a
        bug ("my new product is not searchable").

        The rebuild is not required for correctness — visibility is re-checked on every query — but stale
        entries are not *found*, so a new product is invisible to search until the next rebuild.
      operationId: reindexSearch
      responses:
        "200":
          description: Documents and tokens indexed
          content:
            application/json:
              schema:
                type: object
                properties:
                  search:
                    type: object
                    properties:
                      documents: { type: integer }
                      tokens: { type: integer }
                      built_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/orders:
    get:
      tags: [commerce]
      summary: Own orders
      operationId: listOrders
      responses:
        "200": { description: Orders }
    post:
      tags: [commerce]
      summary: Create an order and a payment intent
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        "201": { description: Order created (status pending) }
        "403":
          description: |
            The account's email address has not been verified. Purchases are refused until it is:
            a receipt and a refund both need a mailbox the platform can actually reach.
            Error code `EMAIL_NOT_VERIFIED`.

  /v1/orders/{id}:
    get:
      tags: [commerce]
      summary: One order
      description: Status only becomes paid after a verified provider webhook.
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Order }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/orders/{id}/simulate-payment:
    post:
      tags: [commerce]
      summary: Send a signed sandbox webhook (development only)
      description: |
        Present only when `EDUMART_ALLOW_SANDBOX_PAYMENTS=true`. It posts a real HMAC-signed webhook
        to the same handler production uses, so the paid path is exercised end to end — it does not
        flip the order status directly.
      operationId: simulatePayment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Webhook accepted }
        "404": { description: Disabled in this environment }

  /v1/webhooks/payments/{provider}:
    post:
      tags: [commerce]
      summary: Payment provider callback
      description: |
        Authenticated by HMAC-SHA256 over the raw body in `X-Edumart-Signature`, never by session.
        Provider event ids are unique, so a replayed callback returns `{ "duplicate": true }` and
        grants nothing twice. Amount and currency are verified against the order.
      operationId: paymentWebhook
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [sandbox, paystack] }
        - name: X-Edumart-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, orderId, amountMinor, currency]
              properties:
                eventId: { type: string }
                orderId: { type: string }
                amountMinor: { type: integer }
                currency: { type: string, default: NGN }
      responses:
        "200":
          description: Processed or already processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
        "401":
          description: Missing or invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/library:
    get:
      tags: [commerce]
      summary: Entitlements granted by paid orders
      operationId: getLibrary
      responses:
        "200": { description: Library }

  /v1/rewards:
    get:
      tags: [rewards]
      summary: Points balance and ledger
      description: Learn points are a separate append-only ledger from commission.
      operationId: getRewards
      responses:
        "200":
          description: Rewards
          content:
            application/json:
              schema:
                type: object
                properties:
                  rewards:
                    type: object
                    properties:
                      pointsBalance: { type: integer }
                      entries:
                        type: array
                        items:
                          type: object

  /v1/rewards/redeem:
    post:
      tags: [rewards]
      summary: Redeem points
      operationId: redeemPoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: integer, minimum: 1 }
      responses:
        "200": { description: Redeemed }
        "409":
          description: Insufficient balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/referrals/me:
    get:
      tags: [rewards]
      summary: Own referral code and qualification
      operationId: getMyReferral
      responses:
        "200": { description: Referral }

  /v1/referrals/tree:
    get:
      tags: [rewards]
      summary: Multi-level referral tree
      description: |
        The caller's downline, rung by rung, up to the configured programme depth. Each level reports how many
        people it contains, how many of them qualified, its rate, and what it has actually paid — commission is
        read from the ledger, so the tree can never disagree with a payout report.

        Members are shown by first name and initials. A referral tree answers "is my link working?", it is not
        a contact export, so no email address or phone number appears here.
      operationId: getReferralTree
      responses:
        "200":
          description: The tree
          content:
            application/json:
              schema:
                type: object
                required: [tree]
                properties:
                  tree: { $ref: "#/components/schemas/ReferralTree" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/support-cases:
    post:
      tags: [staff]
      summary: Open a support case
      operationId: openSupportCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string }
                message: { type: string }
                questionVersionId: { type: string }
      responses:
        "201": { description: Case opened }

  /v1/admin/organizations:
    get:
      tags: [moderation]
      summary: Institutions waiting on a decision
      description: |
        Platform administrators only. Without this, approval is a feature nobody can operate: a member of
        staff would have to guess organisation ids.

        There is no separate application object, because an institution exists from the moment it is
        created — it simply is not verified. `status` omitted means "everything that is not active", which
        is what a reviewer actually works through; results are oldest first so the queue is worked from
        the front. `ownerEmail` is included because approving means being able to contact the applicant.
      operationId: listOrganizationApprovals
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending_verification, active, suspended, rejected]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Matching organisations, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/organizations/{id}/reject:
    post:
      tags: [moderation]
      summary: Refuse an institution's application
      description: |
        Platform administrators only, and only while the institution is still `pending_verification`. A
        rejection keeps the record — an institution that was refused is exactly what a future reviewer
        needs — and records the reason in the audit trail.

        A rejected institution can still be approved later: refusing an application is a decision, not a
        permanent ban, and appeals should not require a new organisation.
      operationId: rejectOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The rejected institution
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/reminders:
    get:
      tags: [operations]
      summary: Scheduled reminders and their health
      description: |
        Platform administrators and support. Answers "was this learner told?" without reading anyone's
        inbox: the reminder body is generated from public facts, and the payload says whether it was
        sent, still pending, or skipped because the reason had gone away.

        A `skipped` reminder is a record, not a deletion. "We decided to warn them and then did not,
        because they had submitted" is an answer support needs.
      operationId: listReminders
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Reminders, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items: { $ref: "#/components/schemas/Reminder" }
                  stats: { $ref: "#/components/schemas/ReminderStats" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/reminders/sweep:
    post:
      tags: [operations]
      summary: Plan and send due reminders now
      description: |
        An operator lever, not a test hook: when a learner asks "was I warned?", the answer should be
        actionable now rather than at the next scheduler tick. Platform administrators only, and every
        sweep is written to the audit log, because it sends real mail to real people.

        Planning is idempotent — the dedupe key makes re-deciding a no-op — and each reminder is claimed
        (`pending → claimed`) before it is sent, so two workers cannot both deliver it. Reminders are also
        revalidated at send time: a warning about an assessment the learner has since submitted is marked
        `skipped` rather than sent.
      operationId: sweepReminders
      responses:
        "200":
          description: What this sweep decided and did
          content:
            application/json:
              schema:
                type: object
                properties:
                  planned:
                    type: integer
                    description: Newly scheduled reminders. Zero on a second sweep in the same window.
                  sent: { type: integer }
                  skipped:
                    type: integer
                    description: Reminders whose reason no longer held, such as an assessment already submitted.
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users:
    get:
      tags: [moderation]
      summary: Find an account to moderate
      description: |
        Platform administrators only. This exists because moderation without lookup is theory: an
        administrator cannot suspend an account they cannot find, and copying an id out of the database
        is how the wrong account gets suspended.

        Results carry identity and status only — never a password hash, a session token, or verification
        secrets. `q` matches part of the email address or the display name.
      operationId: searchUsers
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, suspended] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Matching accounts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users/{id}/suspend:
    post:
      tags: [moderation]
      summary: Suspend an account and end its sessions
      description: |
        Platform administrators only, and never against an administrator or yourself: an admin who can
        lock out every other admin is a single point of compromise.

        Suspension is one transaction — status, reason, actor, every live session revoked, and any
        outstanding verification code withdrawn. A suspension that leaves a working session behind is not
        a suspension. Reinstating does **not** restore the old sessions; the person signs in again.

        A reason is required. "Why was this person locked out" is the first question support asks, and an
        unexplained suspension is indistinguishable from a bug.
      operationId: suspendUser
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The account with its new status
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/users/{id}/reinstate:
    post:
      tags: [moderation]
      summary: Return a suspended account to normal use
      description: |
        Platform administrators only. Reinstatement clears the suspension and its reason, records who
        lifted it, and returns the account to `active`. Sessions are not restored: signing in again also
        re-establishes that the person still controls the mailbox.
      operationId: reinstateUser
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: The account with its new status
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/deliveries:
    get:
      tags: [operations]
      summary: Recent outbound messages and delivery health
      description: |
        Every verification code, reset link and invitation is recorded before it is attempted, then
        retried on a backoff until it succeeds or is abandoned. This endpoint is how "the emails are
        not arriving" gets answered without opening a provider dashboard.

        Message bodies are never returned: an operator needs to know a message failed, not to read the
        credential it carried. Bodies are cleared from the queue as soon as a message is delivered or
        abandoned, so the queue is not a second copy of user inboxes.
      operationId: listDeliveries
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/Delivery" }
                  stats: { $ref: "#/components/schemas/DeliveryStats" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/review-queue:
    get:
      tags: [staff]
      summary: Content awaiting review
      operationId: reviewQueue
      responses:
        "200": { description: Queue }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/question-versions/{id}/review:
    post:
      tags: [staff]
      summary: Approve or reject a question version
      operationId: reviewQuestionVersion
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string }
      responses:
        "200": { description: Recorded }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/metrics:
    get:
      tags: [staff]
      summary: Operations metrics
      operationId: adminMetrics
      responses:
        "200": { description: Metrics }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/orders/{id}/refund:
    post:
      tags: [commerce, staff]
      summary: Refund an order, in full or in part
      description: |
        Money is corrected by appending a refund, never by editing the order. `orders.totalMinor`
        keeps stating what was charged; the refund rows state what came back.

        The call is a **request**: it reserves the amount, asks the payment provider to return the
        money, and records what came back. The response's `refund.status` says which of four things
        happened — `pending` (accepted, confirmation still to come), `succeeded` (settled now),
        `failed` (the provider refused, nothing moved, the amount is available again), or
        `needs_review` (the provider's answer was ambiguous and no automatic retry happened, because a
        blind retry against an API that may already have paid out refunds twice).

        Omit `amountMinor` to refund whatever is left. An amount greater than the remainder is refused
        with `409 CONFLICT` and details naming the total, what has been refunded or reserved, and what
        remains — pending refunds count, because money already promised cannot be promised again.
        Repeating a request with the same `idempotencyKey` returns the original refund instead of
        creating a second one, and does not call the provider again.

        The order's status, its entitlements and the commission reversal change when the refund
        **settles**, not when it is requested: revoking access for money that has not moved is the bug
        this lifecycle exists to prevent.
      operationId: refundOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amountMinor:
                  type: integer
                  minimum: 1
                  description: Amount to return in the currency's minor unit. Omit to refund the remainder.
                reason:
                  type: string
                  description: Why the money is going back. Required — an unexplained refund cannot be audited.
                idempotencyKey:
                  type: string
                  description: Client-generated; a retry with the same key returns the original refund.
      responses:
        "200":
          description: Refund requested and its lifecycle state recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/refunds/{id}/resolve:
    post:
      tags: [commerce, staff]
      summary: Resolve a refund whose provider outcome was ambiguous
      description: |
        Finance and platform admins only. A refund in `needs_review` means the provider never answered
        clearly — a timeout, a 5xx, a dropped connection — and the system refused to guess, because
        guessing there means moving money twice.

        The operator checks the provider's dashboard and reports what they found. `succeeded` settles the
        refund through the same path a provider confirmation would (order status, entitlements, commission
        reversal, receipt); `failed` records that no money moved and releases the reservation. The note is
        required and the decision is audited against the person who made it.

        A settled refund cannot be re-resolved: `409 CONFLICT`. Records are not rewritten.
      operationId: resolveRefund
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome:
                  type: string
                  enum: [succeeded, failed]
                note:
                  type: string
                  minLength: 3
                  description: What was checked. "Done" is not an audit trail.
      responses:
        "200":
          description: The refund, in its resolved state
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/orders/{id}/refunds:
    get:
      tags: [commerce, staff]
      summary: Refunds recorded against an order
      description: Readable by support as well as finance — answering "where is my refund?" must not need a refund permission.
      operationId: listOrderRefunds
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refunds
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunds:
                    type: array
                    items: { $ref: "#/components/schemas/Refund" }
                  totalMinor: { type: integer }
                  refundedMinor: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/finance/reconciliation:
    get:
      tags: [commerce, staff]
      summary: Reconcile the books against themselves
      description: |
        Not a revenue report: a list of places where two records of the same money disagree, plus
        the number of checks that ran. An empty `discrepancies` list with a `checked` count is the
        claim; a report that silently checked nothing is worse than no report.

        Checks: `paid_without_entitlement`, `entitlement_without_payment`,
        `refund_exceeds_total`, `succeeded_attempt_unpaid`, `paid_without_attempt`.
      operationId: financeReconciliation
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
                type: object
                properties:
                  reconciliation: { $ref: "#/components/schemas/Reconciliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/cases:
    get:
      tags: [staff]
      summary: Support cases
      operationId: adminCases
      responses:
        "200": { description: Cases }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/cases/{id}/resolve:
    post:
      tags: [staff]
      summary: Resolve a support case
      operationId: resolveCase
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Resolved }

  /v1/join/{slug}:
    get:
      tags: [live]
      summary: Resolve a shareable join link
      description: |
        The one anonymous live-class route. It answers "what is this, who hosts it, what does it cost?" before a
        visitor has an account, because a link that demands sign-in before saying what it is for is a link
        nobody clicks twice. It deliberately does not list the roster.
      operationId: resolveJoinLink
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 4, maxLength: 32 }
      responses:
        "200":
          description: The class the link points at
          content:
            application/json:
              schema:
                type: object
                required: [class]
                properties:
                  class: { $ref: "#/components/schemas/JoinInvite" }
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/virtual-classes:
    get:
      tags: [live]
      summary: List live classes
      operationId: listVirtualClasses
      parameters:
        - name: scope
          in: query
          required: false
          description: hosting, attending, or upcoming (default) for classes the caller may see.
          schema: { type: string, enum: [upcoming, hosting, attending, all] }
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items: { $ref: "#/components/schemas/VirtualClass" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [live]
      summary: Schedule a class (free or paid)
      description: |
        Any signed-in account may host: a student running a revision session is as valid as an institution
        running a lecture, so there is no role check. `creditsCost` 0 means free. A price is taken in learning
        credits only — the API never holds a card on behalf of a host.
      operationId: createVirtualClass
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVirtualClassRequest" }
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  class: { $ref: "#/components/schemas/VirtualClass" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/virtual-classes/{id}:
    get:
      tags: [live]
      summary: One class, including the caller's role in it
      operationId: getVirtualClass
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      responses:
        "200":
          description: The class
          content:
            application/json:
              schema:
                type: object
                properties:
                  class: { $ref: "#/components/schemas/VirtualClass" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/virtual-classes/{id}/join:
    post:
      tags: [live]
      summary: Take a seat, paying credits or applying a discount code
      description: |
        One transaction re-reads the price, the capacity and the discount inside the lock. Three things follow
        from that and are contractual:

        - `409` when the last seat went to somebody else, or when the caller cannot afford the price;
        - `409` when a discount code has expired or has no uses left;
        - `200` with `alreadyJoined: true` and `creditsSpent: 0` when the caller is already seated, so a retried
          submit is never a second charge.
      operationId: joinVirtualClass
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                discountCode:
                  type: string
                  description: Optional. Without one the class's full credit price applies.
      responses:
        "200":
          description: Seated
          content:
            application/json:
              schema:
                type: object
                properties:
                  class: { $ref: "#/components/schemas/VirtualClass" }
                  attendee: { $ref: "#/components/schemas/Attendee" }
                  creditsSpent: { type: integer }
                  discountApplied: { type: integer, description: Percentage, 0 when none was used. }
                  alreadyJoined: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Full, finished, unaffordable, or the code is not usable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/virtual-classes/{id}/leave:
    post:
      tags: [live]
      summary: Leave the room
      description: Stamps `leftAt` so the attendance report has an end time. Idempotent.
      operationId: leaveVirtualClass
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      responses:
        "200": { description: Left }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/virtual-classes/{id}/start:
    post:
      tags: [live]
      summary: Start the session (host only)
      description: Opens a session row and marks the class live. Repeatable, so a host who reloads the room is not locked out.
      operationId: startVirtualClass
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      responses:
        "200": { description: Started }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/virtual-classes/{id}/end:
    post:
      tags: [live]
      summary: End the session (host only)
      description: Closes the open session and the class. An ended class refuses new joins, or the attendance report becomes a lie.
      operationId: endVirtualClass
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      responses:
        "200": { description: Ended }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/virtual-classes/{id}/roster:
    get:
      tags: [live]
      summary: Attendee list with avatars and presence
      description: |
        `present` is a heartbeat, not a flag: true only while the attendee has been seen within the presence
        window (75 seconds). A browser that crashes never sends a leave, so presence has to decay on its own.
      operationId: virtualClassRoster
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      responses:
        "200":
          description: Attendees, host first
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendees:
                    type: array
                    items: { $ref: "#/components/schemas/Attendee" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/virtual-classes/{id}/ice:
    get:
      tags: [live]
      summary: ICE servers for the room
      description: |
        Handed straight to `RTCPeerConnection`. Audio and video never reach the API — peers connect directly
        under DTLS-SRTP — so what this returns is the whole of NAT traversal for this deployment. With STUN
        alone, two peers behind symmetric NAT cannot connect; that is a stated limit, not a bug.
      operationId: virtualClassICEServers
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      responses:
        "200":
          description: RTCPeerConnection iceServers shape
          content:
            application/json:
              schema:
                type: object
                properties:
                  iceServers:
                    type: array
                    items:
                      type: object
                      properties:
                        urls:
                          oneOf:
                            - { type: string }
                            - { type: array, items: { type: string } }
                        username: { type: string }
                        credential: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/virtual-classes/{id}/board:
    get:
      tags: [live]
      summary: Replay whiteboard events
      description: Returns every stored event after `since`, in order, so a late joiner sees the board as it stands.
      operationId: getVirtualClassBoard
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
        - name: since
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Ordered ciphertext
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/BoardEvent" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [live]
      summary: Append a whiteboard event
      description: |
        The payload is opaque ciphertext under a room key the server never receives. Only shape is validated, so
        plaintext is refused outright: the API has no key, and storing anything else would make "end-to-end
        encrypted" false. `seq` is assigned by the server and is dense, so the board has no holes.
      operationId: appendVirtualClassBoardEvent
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, ciphertext]
              properties:
                nonce: { type: string, minLength: 8, maxLength: 64, description: base64url }
                ciphertext: { type: string, minLength: 16, maxLength: 16384, description: base64url }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  seq: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/virtual-classes/{id}/signal:
    get:
      tags: [live]
      summary: Poll the signalling relay
      description: |
        SDP and ICE candidates only. The relay is targeted at members of the class, and rows are pruned after ten
        minutes because they contain the peers' addresses and are worthless within seconds. Polling is also the
        presence heartbeat.
      operationId: pollVirtualClassSignals
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
        - name: since
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: wait
          in: query
          required: false
          description: Long-poll seconds. 0 returns immediately.
          schema: { type: integer, default: 0, maximum: 25 }
      responses:
        "200":
          description: Signals after the cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals:
                    type: array
                    items: { $ref: "#/components/schemas/Signal" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [live]
      summary: Post a signalling message
      operationId: postVirtualClassSignal
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, payload]
              properties:
                kind:
                  type: string
                  enum: [offer, answer, ice, presence, leave, chat]
                toUserId:
                  type: string
                  description: Empty for a broadcast; a non-member is a 404.
                payload: { type: string, maxLength: 65536, description: Opaque base64 body. }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  seq: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/virtual-classes/{id}/attendance:
    get:
      tags: [live]
      summary: Session tracking report (host only)
      description: Minutes in the room, session count, first and last heartbeat, and what each attendee paid.
      operationId: virtualClassAttendance
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      responses:
        "200":
          description: Attendance
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendance:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceRow" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/virtual-classes/{id}/discount-codes:
    get:
      tags: [live]
      summary: List a class's discount codes (host only)
      operationId: listVirtualClassDiscountCodes
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      responses:
        "200":
          description: Codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  discountCodes:
                    type: array
                    items: { $ref: "#/components/schemas/DiscountCode" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [live]
      summary: Create a discount code (host only)
      description: |
        A percentage off the credit price with an optional use limit and expiry. The limit is enforced in the
        UPDATE that increments the counter, so two simultaneous uses of the last one cannot both succeed.
      operationId: createVirtualClassDiscountCode
      parameters:
        - $ref: "#/components/parameters/VirtualClassId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percentOff]
              properties:
                percentOff: { type: integer, minimum: 1, maximum: 100 }
                maxUses: { type: integer, minimum: 0, description: 0 means unlimited. }
                expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  discountCode: { $ref: "#/components/schemas/DiscountCode" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: edumart_session
    bearerSession:
      type: http
      scheme: bearer

  parameters:
    VirtualClassId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    QuestionVersionId:
      name: qvId
      in: path
      required: true
      schema: { type: string }
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: { type: string }

  responses:
    Conflict:
      description: The request conflicts with the account's current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: One or more fields are invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests; `Retry-After` is set
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    SearchResult:
      type: object
      required: [type, id, title, href, score]
      properties:
        type: { type: string, enum: [product, subject, topic] }
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        snippet:
          type: string
          description: A bounded excerpt around the first match, present only when the body matched.
        href: { type: string, description: An in-app path the client can link to. }
        score: { type: integer }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - SESSION_EXPIRED
                - SESSION_CLOSED
                - ASSESSMENT_CLOSED
                - RATE_LIMITED
                - INTERNAL
            message: { type: string }
            request_id: { type: string }
            details:
              oneOf:
                - type: array
                  items:
                    type: object
                    properties:
                      field: { type: string }
                      message: { type: string }
                - type: object
                  additionalProperties: true

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string }
        examPathwayId: { type: [string, "null"] }
        targetDate: { type: [string, "null"] }
        timezone: { type: string }
        dailyMinutes: { type: integer }
        roles:
          type: array
          items: { type: string }
        accountType:
          type: string
          enum: [student, tutor, institution]
          description: Signup intent, echoed back so a client can resume the right onboarding. Never an authority.
        onboardingStep: { type: integer }
        phone:
          type: [string, "null"]
          description: E.164 number on file, verified or not.
        emailVerified:
          type: boolean
          description: True only after a code sent to the address was confirmed.
        phoneVerified: { type: boolean }

    Class:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        subjectId: { type: string, nullable: true }
        organizationId:
          type: string
          nullable: true
          description: The institution that owns the class; null for a teacher's personal class.
        joinCode: { type: string }
        role: { type: string, enum: [teacher, student] }
        members: { type: integer }
        assignments: { type: integer }
        createdAt: { type: string, format: date-time }

    UserSummary:
      type: object
      description: An account as the moderation console sees it. No credentials, ever.
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, suspended] }
        suspended: { type: boolean }
        suspendedReason: { type: string }
        roles:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    Reminder:
      type: object
      description: |
        One message the system promised to send later. The row is written when the decision is made, so a
        restart between "decided" and "due" loses nothing, and a reminder that was withdrawn can still be
        explained afterwards.
      properties:
        id: { type: string }
        userId: { type: string }
        kind: { type: string, enum: [study_nudge, deadline] }
        templateKey: { type: string }
        subject: { type: string }
        body:
          type: string
          description: |
            The words that will be sent. Unlike delivery bodies, this is safe to show: it is generated from
            public facts (an assessment title, a closing time) and carries no credential.
        resourceId:
          type: string
          description: The row this reminder is about — an assessment definition for a deadline warning.
        dueAt: { type: string, format: date-time }
        dedupeKey:
          type: string
          description: Unique per reminder per learner per window. A unique index, not a check in Go.
        status: { type: string, enum: [pending, claimed, sent, skipped, cancelled] }
        createdAt: { type: string, format: date-time }
        claimedAt: { type: string }
        settledAt: { type: string }
        deliveryId:
          type: string
          description: Set once the reminder has been handed to the delivery queue.
        note:
          type: string
          description: Why a reminder was skipped — for example "already submitted".

    ReminderStats:
      type: object
      properties:
        pending: { type: integer }
        claimed: { type: integer }
        sent: { type: integer }
        skipped: { type: integer }
        cancelled: { type: integer }

    Delivery:
      type: object
      description: One outbound message. The body is deliberately absent.
      properties:
        id: { type: string }
        channel: { type: string, enum: [email, phone] }
        recipient: { type: string }
        template: { type: string, example: verify_email }
        subject: { type: string }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lastError:
          type: string
          description: The provider's last complaint, truncated. Empty once the message is delivered.
        resourceType: { type: string, enum: ["", verification_code, password_reset_token, invitation, order, reminder] }
        resourceId: { type: string }
        createdAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        sentAt: { type: string }

    DeliveryStats:
      type: object
      properties:
        sent: { type: integer }
        pending: { type: integer }
        failed: { type: integer }

    Organization:
      type: object
      required: [id, name, slug, kind, status, verified, role]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [school, centre, ngo, company] }
        status: { type: string, enum: [pending_verification, active, suspended] }
        verified: { type: boolean }
        verifiedAt: { type: string }
        role:
          type: string
          enum: [owner, admin, teacher, student, platform_admin]
          description: The caller's own membership role; `platform_admin` when access is administrative.
        members: { type: integer }
        classes: { type: integer }
        createdAt: { type: string, format: date-time }

    OrganizationMember:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, teacher, student] }
        status: { type: string }
        joinedAt: { type: string, format: date-time }

    Invitation:
      type: object
      description: An offer of membership. The token is returned once, at creation, and never listed.
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, teacher, student] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        maxUses: { type: integer }
        useCount: { type: integer }

    SessionIssued:
      type: object
      required: [token, expires_at, refresh_token, refresh_expires_at, user]
      properties:
        token:
          type: string
          description: Opaque access token, valid 7 days. The web app never reads it (HttpOnly cookie).
        expires_at: { type: string, format: date-time }
        refresh_token:
          type: string
          description: |
            Single-use refresh token, valid 30 days. Exchanged at `/v1/auth/refresh` for a new pair; the
            presented token dies the moment the exchange succeeds. Storing it in a place script can read
            is storing a 30-day credential in a place script can read.
        refresh_expires_at: { type: string, format: date-time }
        next: { type: string }
        user: { $ref: "#/components/schemas/User" }

    Refund:
      type: object
      description: |
        One return of money. Refunds are append-only: two partial refunds are two rows, and the amount
        returned so far is their sum. Nothing here edits the charge it compensates.

        A refund is a **request** until a provider confirms it, and `status` is what says which:

        - `pending` — accepted by the provider, not yet confirmed. No money has moved, so the order is
          unchanged and the amount is reserved against its total.
        - `succeeded` — the provider confirmed it. The only status counted as money returned; the order
          becomes `partially_refunded` or `refunded` and a full refund revokes entitlements.
        - `failed` — the provider refused. No money moved, and the amount is available again.
        - `needs_review` — the provider's answer was ambiguous (a timeout, a 5xx). Deliberately not retried:
          a blind retry against an API that may already have paid out is how a customer is refunded twice.
          A human resolves it via `POST /v1/admin/refunds/{id}/resolve`.
      required: [id, orderId, amountMinor, currency, fullRefund, reason, status, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        fullRefund:
          type: boolean
          description: True when this refund returns everything that was left on the order.
        reason: { type: string }
        actorUserId: { type: string, nullable: true }
        provider: { type: string, description: The provider that was asked to move the money. }
        providerReference:
          type: string
          description: The provider's id for the refund, used to match its confirmation webhook.
        status:
          type: string
          enum: [pending, succeeded, failed, needs_review]
        providerStatus:
          type: string
          description: The provider's own untranslated word for the state, kept as evidence.
        failureReason:
          type: string
          description: Why it failed, or why a human resolved an ambiguous refund the way they did.
        settledAt:
          type: string
          format: date-time
          description: When the money actually moved, as distinct from when the refund was requested.
        idempotencyKey: { type: string }
        createdAt: { type: string, format: date-time }

    Discrepancy:
      type: object
      required: [kind, orderId, detail]
      properties:
        kind:
          type: string
          enum:
            - paid_without_entitlement
            - entitlement_without_payment
            - refund_exceeds_total
            - refund_unsettled
            - succeeded_attempt_unpaid
            - paid_without_attempt
        orderId: { type: string }
        detail: { type: string, description: What the two records say, in words an operator can act on. }

    Reconciliation:
      type: object
      required: [from, to, checked, paidOrders, discrepancies]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        checked:
          type: integer
          description: How many distinct checks ran. A report that checked nothing is not a clean report.
        paidOrders: { type: integer }
        refundedMinor:
          type: integer
          description: Money that actually went back. Refunds still in flight are excluded.
        pendingRefunds:
          type: integer
          description: Refunds promised but not settled. Never part of refundedMinor.
        pendingRefundsMinor: { type: integer }
        webhookFailures: { type: integer }
        discrepancies:
          type: array
          items: { $ref: "#/components/schemas/Discrepancy" }

    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
        examPathwayId: { type: [string, "null"] }
        targetDate: { type: [string, "null"], format: date }
        subjectIds:
          type: array
          items: { type: string }
        dailyMinutes: { type: integer }
        accountType:
          type: string
          enum: [student, tutor, institution]
          default: student
          description: |
            What kind of account the person is creating. This is signup *intent*, not authority: it routes
            onboarding and nothing else. An `institution` account still needs organisation verification and
            an administrator's approval, and a `tutor` account still needs an invitation before it can teach
            inside an organisation, so choosing a type never grants a role.
        referralCode: { type: string }
        timezone: { type: string, default: Africa/Lagos }
        client: { type: string, enum: [web, mobile] }
        onboardingStep: { type: integer }

    SignupDraftResponse:
      type: object
      properties:
        draft:
          type: [object, "null"]
          properties:
            examPathwayId: { type: string }
            examPathwayKey: { type: string }
            subjectIds:
              type: array
              items: { type: string }
            targetDate: { type: string }
            dailyMinutes: { type: integer }
            displayName: { type: string }
            email: { type: string }
            timezone: { type: string }
            accountType: { type: string, enum: [student, tutor, institution] }
        step:
          type: [string, "null"]
          enum: [pathway, subjects, schedule, account, confirm, null]
        stepIndex: { type: integer }
        referralCode: { type: string }
        token:
          type: string
          description: Returned only on creation.

    VirtualClass:
      type: object
      required: [id, slug, title, creditsCost, status, startsAt, joinUrl]
      properties:
        id: { type: string }
        slug:
          type: string
          description: 16 characters from an alphabet without ambiguous letters. Rotating it is not supported on purpose: a link sent to forty learners must keep working.
        title: { type: string }
        description: { type: string }
        subjectId: { type: [string, "null"] }
        creditsCost:
          type: integer
          description: Price in learning credits. 0 means free.
        capacity: { type: integer, description: 0 means unlimited. }
        status: { type: string, enum: [scheduled, live, ended, cancelled] }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        hostUserId: { type: string }
        hostName: { type: string }
        hostAvatar: { $ref: "#/components/schemas/Avatar" }
        attendees: { type: integer }
        joinUrl: { type: string, description: Absolute URL of the room, built from the deployment's web origin. }
        role: { type: string, enum: [host, attendee, none] }
        createdAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }

    CreateVirtualClassRequest:
      type: object
      required: [title, startsAt]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string }
        subjectId: { type: [string, "null"] }
        creditsCost: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        capacity: { type: integer, minimum: 0, maximum: 5000, default: 0 }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 15, maximum: 480, default: 60 }

    Avatar:
      type: object
      required: [initials, color]
      properties:
        initials: { type: string }
        color:
          type: string
          description: Stable colour derived from the user id, so two clients draw the same person identically.

    Attendee:
      type: object
      required: [userId, displayName, avatar, role, presence]
      properties:
        userId: { type: string }
        displayName: { type: string }
        avatar: { $ref: "#/components/schemas/Avatar" }
        role: { type: string, enum: [host, attendee] }
        paymentMethod: { type: string, enum: [free, credits, discount, host] }
        creditsPaid: { type: integer }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: [string, "null"], format: date-time }
        present:
          type: boolean
          description: True only while a heartbeat was seen inside the presence window.

    BoardEvent:
      type: object
      required: [seq, authorId, nonce, ciphertext]
      properties:
        seq: { type: integer, description: Dense and monotonic per class; the client orders the board by it. }
        authorId: { type: string }
        nonce: { type: string }
        ciphertext: { type: string }
        createdAt: { type: string, format: date-time }

    Signal:
      type: object
      properties:
        seq: { type: integer }
        fromUserId: { type: string }
        toUserId: { type: [string, "null"] }
        kind: { type: string, enum: [offer, answer, ice, presence, leave, chat] }
        payload: { type: string }
        createdAt: { type: string, format: date-time }

    AttendanceRow:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        sessions: { type: integer }
        minutes: { type: integer }
        firstJoinedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        creditsPaid: { type: integer }

    DiscountCode:
      type: object
      properties:
        code: { type: string }
        percentOff: { type: integer }
        maxUses: { type: integer }
        uses: { type: integer }
        expiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    JoinInvite:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        hostName: { type: string }
        startsAt: { type: string, format: date-time }
        creditsCost: { type: integer }
        status: { type: string }
        joinUrl: { type: string }

    ReferralTree:
      type: object
      description: The caller's downline. Rates and money come from the configuration and the ledger, in that order, so this cannot flatter a referrer.
      properties:
        code: { type: string }
        ratesPercent:
          type: array
          items: { type: integer }
        levels:
          type: array
          items:
            type: object
            properties:
              level: { type: integer }
              ratePercent: { type: integer }
              referrals: { type: integer }
              qualified: { type: integer }
              commissionMinor: { type: integer }
              members:
                type: array
                items:
                  type: object
                  properties:
                    displayName: { type: string }
                    initials: { type: string }
                    joinedAt: { type: string, format: date-time }
                    qualified: { type: boolean }
        totalReferrals: { type: integer }
        totalCommissionMinor: { type: integer }

    Readiness:
      type: object
      required: [status, time, driver, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        time: { type: string, format: date-time }
        driver: { type: string }
        request_id: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string, enum: [database, migrations] }
              status: { type: string, enum: [ok, fail] }
              detail: { type: string }
              latency: { type: string }

    SessionView:
      type: object
      required: [id, client, createdAt, expiresAt, current]
      properties:
        id:
          type: string
          description: Hash of the session token; not usable as a credential.
        client: { type: string, enum: [web, mobile] }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current:
          type: boolean
          description: True for the session that authenticated this request.

    Subject:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        topics: { type: integer }

    Option:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        text: { type: string }

    Question:
      type: object
      description: |
        Answer key fields are absent until `result_released`. They are not sent as null, so a client
        cannot distinguish "hidden" from "empty" and cache a wrong assumption.
      properties:
        qvId: { type: string }
        stem: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/Option" }
        position: { type: integer }
        topicName: { type: string }
        subjectName: { type: string }
        difficulty: { type: string }
        selectedOptionId: { type: [string, "null"] }
        answerVersion: { type: integer }

    ReviewItem:
      type: object
      properties:
        qvId: { type: string }
        answerOptionId: { type: string }
        explanation: { type: string }
        topicName: { type: string }
        topicId: { type: string }
        difficulty: { type: string }

    Score:
      type: object
      properties:
        raw: { type: integer }
        max: { type: integer }
        percent: { type: integer }
        policyVersion: { type: integer }

    AssessmentSession:
      type: object
      required: [session_id, mode, status, deadline_at, server_time, remaining_seconds]
      properties:
        session_id: { type: string }
        mode: { type: string, enum: [practice, mock, assignment] }
        status: { type: string, enum: [in_progress, submitted, expired, cancelled] }
        attempt_no: { type: integer }
        started_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        server_time:
          type: string
          format: date-time
          description: Render the countdown from this, not from the device clock.
        question_count: { type: integer }
        remaining_seconds: { type: integer }
        result_released: { type: boolean }
        questions:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        score:
          oneOf:
            - $ref: "#/components/schemas/Score"
            - type: "null"
        review:
          type: array
          items: { $ref: "#/components/schemas/ReviewItem" }

    SaveResult:
      type: object
      required: [saved, server_saved_at, version, session_status]
      properties:
        saved: { type: boolean }
        server_saved_at: { type: string, format: date-time }
        version: { type: integer }
        session_status: { type: string }
        remaining_seconds: { type: integer }

    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceMinor:
          type: integer
