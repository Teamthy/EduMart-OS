openapi: 3.1.0
info:
  title: Edumart API
  version: 1.0.0
  description: |
    The contract both clients build against. `apps/web` and `apps/mobile` consume these endpoints;
    neither re-implements deadlines, scoring, authorisation, payment confirmation or rewards.

    Conventions that are not optional:

    - Every error uses one envelope: `{ "error": { code, message, request_id, details } }`.
    - Money is an integer number of minor units plus an ISO-4217 currency. Never a float.
    - Timestamps are ISO-8601 UTC with a `Z` suffix. Deadlines come from the server; a client clock
      is display-only.
    - Answer writes carry `expectedVersion` and `clientSequence`; a replayed write returns the same
      version, a stale one returns `409 CONFLICT` with `details.current_version`.
    - Answer keys and explanations are absent from every response until `result_released` is true.
    - Payment truth comes only from `POST /webhooks/payments/{provider}` with a valid
      `X-Edumart-Signature`.

    Authentication is an httpOnly session cookie (web) or `Authorization: Bearer <token>`
    (native). Both resolve to the same server-side session.
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development (the web app proxies /v1 from its own origin)
  - url: https://api.edumart.ng
    description: Production

tags:
  - name: identity
  - name: signup
  - name: content
  - name: assessment
  - name: classroom
  - name: commerce
  - name: rewards
  - name: staff

paths:
  /healthz:
    get:
      summary: Liveness and driver in use
      description: |
        Cheap and dependency-free by design. It answers "is this process alive", never "can it serve
        traffic" — failing liveness because a dependency is down would restart a healthy process and
        turn one outage into two.
      operationId: healthz
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status, time, driver]
                properties:
                  status: { type: string, const: ok }
                  time: { type: string, format: date-time }
                  driver: { type: string, enum: [sqlite3] }

  /readyz:
    get:
      summary: Readiness — real dependency checks
      description: |
        Used by load balancers and deploy gates. Probes the database (ping plus a real read) and
        verifies that every embedded migration is applied. Returns 503 with a per-check breakdown
        when anything is wrong, so an operator learns *which* dependency failed from the body.

        `healthz` staying green while `readyz` is red is the intended signal: restarting the process
        would not help.
      operationId: readyz
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: A dependency is unavailable or the schema is out of date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /v1/auth/register:
    post:
      tags: [identity]
      summary: Create an account, completing the signup wizard
      description: |
        The only endpoint that creates an account. Earlier wizard answers live in a signup draft, so
        no partially registered account exists while the learner is on page three of five.
        Rate limited to 30 requests per minute per address.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and a session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/login:
    post:
      tags: [identity]
      summary: Authenticate
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/logout:
    post:
      tags: [identity]
      summary: Revoke the current session
      operationId: logout
      responses:
        "200": { description: Session revoked }

  /v1/auth/password/forgot:
    post:
      tags: [identity]
      summary: Request a reset token
      description: Always answers 200 so the endpoint cannot be used to enumerate accounts.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Accepted }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password/reset:
    post:
      tags: [identity]
      summary: Set a new password from a reset token
      description: Invalidates every existing session for the account.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, writeOnly: true }
      responses:
        "200": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationError" }

  /v1/auth/verification/request:
    post:
      tags: [identity]
      summary: Send a verification code
      description: |
        Sends a six-digit code to the account's email address, or to a phone number supplied with the
        request (stored unverified first, normalised to E.164). The code itself is never returned and
        never logged outside development; the response only says where it went, masked.

        Throttled per user and channel: one code per 60 seconds, five per hour. A code that fails to
        deliver is discarded rather than left valid.
      operationId: requestVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [email, phone] }
                phone:
                  type: string
                  description: Required the first time a phone is verified. Local numbers such as 0803 123 4567 are normalised.
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  channel: { type: string, enum: [email, phone] }
                  destination:
                    type: string
                    description: Masked, for recognising which address or number was used.
                  expires_at: { type: string, format: date-time }
                  resend_after: { type: integer, description: Seconds before another code may be requested }
                  attempts_allowed: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { description: Too many codes requested }

  /v1/auth/verification/confirm:
    post:
      tags: [identity]
      summary: Confirm a verification code
      description: |
        Checks the newest live code for the channel and, on success, records proof of ownership.
        A code is single-use, expires after 15 minutes, and is spent after five wrong attempts.
        Every failure returns the same validation shape, so the response never reveals whether a
        code existed.
      operationId: confirmVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, code]
              properties:
                channel: { type: string, enum: [email, phone] }
                code: { type: string, description: Six digits, as sent }
      responses:
        "200":
          description: Channel verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  channel: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/signup-drafts:
    post:
      tags: [signup]
      summary: Start a signup draft
      description: Returns an opaque token; the web app stores it in an httpOnly cookie.
      operationId: createSignupDraft
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                referralCode: { type: string }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupDraftResponse"

  /v1/signup-drafts/current:
    get:
      tags: [signup]
      summary: Read the draft for this visitor
      description: |
        Server-persisted wizard progress. This is what makes the flow resumable across a refresh,
        a different device, or the other client.
      operationId: getSignupDraft
      security: []
      responses:
        "200":
          description: Current draft, or nulls when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupDraftResponse"
    patch:
      tags: [signup]
      summary: Write answers for the current step
      operationId: updateSignupDraft
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentStep:
                  type: string
                  enum: [pathway, subjects, schedule, account, confirm]
                examPathwayKey: { type: string }
                examPathwayId: { type: string }
                subjectIds:
                  type: array
                  items: { type: string }
                targetDate: { type: string, format: date }
                dailyMinutes: { type: integer, minimum: 5, maximum: 600 }
                displayName: { type: string }
                email: { type: string, format: email }
                referralCode: { type: string }
                timezone: { type: string }
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupDraftResponse"
        "400": { $ref: "#/components/responses/ValidationError" }

  /v1/me:
    get:
      tags: [identity]
      summary: The signed-in user and their roles
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [identity]
      summary: Update profile settings
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                targetDate: { type: string, format: date }
                dailyMinutes: { type: integer }
                timezone: { type: string }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/sessions:
    get:
      tags: [identity]
      summary: Active sessions (devices) for the caller
      description: |
        Expired and revoked sessions are omitted. `id` is the stored session key — a hash of the
        token — so it can be used to revoke a session but cannot be replayed as credentials.
      operationId: listSessions
      responses:
        "200":
          description: Live sessions, newest first, exactly one marked current
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/sessions/{id}:
    delete:
      tags: [identity]
      summary: Revoke one of the caller's sessions
      description: |
        Scoped to the caller by user id in the query itself, so a session id from another account
        cannot be used to sign somebody else out (404, not 403 — the id is not confirmed to exist).
        Revoking the current session is allowed and ends it.
      operationId: revokeSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
                  wasCurrent: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/exam-pathways:
    get:
      tags: [content]
      summary: Exam pathways available to a new learner
      operationId: listExamPathways
      security: []
      responses:
        "200":
          description: Pathways
          content:
            application/json:
              schema:
                type: object
                properties:
                  pathways:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        key: { type: string }
                        name: { type: string }
                        body: { type: string }
                        blurb: { type: string }
                        subjects: { type: integer }

  /v1/subjects:
    get:
      tags: [content]
      summary: Subjects
      operationId: listSubjects
      security: []
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjects:
                    type: array
                    items: { $ref: "#/components/schemas/Subject" }

  /v1/subjects/{subjectId}/topics:
    get:
      tags: [content]
      summary: Topics for a subject
      operationId: listTopics
      security: []
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200": { description: Topics }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/referrals/validate/{code}:
    get:
      tags: [rewards]
      summary: Check a referral code before it is submitted
      operationId: validateReferralCode
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  referrerName: { type: string }

  /v1/dashboard:
    get:
      tags: [content]
      summary: Learner home read model
      operationId: getDashboard
      responses:
        "200": { description: Dashboard }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/learning-summary:
    get:
      tags: [content]
      summary: Derived progress by topic
      description: Rebuilt from submitted responses; never self-reported and never the source of a score.
      operationId: getLearningSummary
      responses:
        "200": { description: Summary }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/study-plan:
    get:
      tags: [content]
      summary: Current study plan
      operationId: getStudyPlan
      responses:
        "200": { description: Plan }
    put:
      tags: [content]
      summary: Save the study plan
      operationId: saveStudyPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dailyMinutes: { type: integer }
                days:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Saved }

  /v1/practice-sessions:
    post:
      tags: [assessment]
      summary: Start an untimed practice attempt
      description: |
        The session snapshot is frozen here: questions, options and the scoring policy version are
        copied into the attempt, so a later content edit cannot change a past score.
      operationId: startPractice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId]
              properties:
                subjectId: { type: string }
                topicIds:
                  type: array
                  items: { type: string }
                count: { type: integer, minimum: 1, maximum: 50, default: 10 }
                difficulty: { type: string, enum: [easy, medium, hard] }
      responses:
        "201":
          description: Attempt created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssessmentSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/assessment-definitions/{id}/sessions:
    post:
      tags: [assessment]
      summary: Start a graded assessment
      description: |
        Class membership, publication state, availability window and attempt limit are all checked
        server-side. Graded attempts are immutable once submitted.
      operationId: startAssessment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Attempt created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssessmentSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Attempt limit reached or assessment closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/assessment-sessions:
    get:
      tags: [assessment]
      summary: Attempt history
      operationId: listAttempts
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: History }

  /v1/assessment-sessions/{id}:
    get:
      tags: [assessment]
      summary: One attempt, with the review only when results are released
      operationId: getAttempt
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssessmentSession" }
        "403":
          description: Someone else's attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/assessment-sessions/{id}/responses/{qvId}:
    put:
      tags: [assessment]
      summary: Save an answer
      description: |
        Idempotent and version-checked. The server decides whether the attempt is still open; the
        client countdown is display-only. A lost response is retried with the same
        `clientSequence`, which returns the stored version rather than writing twice.
      operationId: saveResponse
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/QuestionVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedOptionId:
                  type: [string, "null"]
                expectedVersion:
                  type: integer
                  minimum: 0
                clientSequence:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Saved (or replayed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "409":
          description: |
            `CONFLICT` with `details.current_version` when the answer changed elsewhere;
            `SESSION_EXPIRED` or `SESSION_CLOSED` when the attempt can no longer accept writes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/assessment-sessions/{id}/corrections/{qvId}:
    put:
      tags: [assessment]
      summary: Correct a practice answer after submission
      description: |
        Practice only. A graded assessment is evidence: the released key cannot be used to rewrite
        its score, so this returns 409 for graded attempts. The response carries the new answer
        version and nothing else — no correctness, no score — so it cannot act as an answer oracle.
      operationId: correctResponse
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/QuestionVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedOptionId: { type: string }
                expectedVersion: { type: integer }
                clientSequence: { type: integer }
      responses:
        "200":
          description: Rescored from stored responses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "409":
          description: Closed, graded, or stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/assessment-sessions/{id}/submit:
    post:
      tags: [assessment]
      summary: Submit and score
      description: Idempotent — submitting twice cannot double-award learning points.
      operationId: submitAttempt
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Final attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/AssessmentSession" }

  /v1/assessment-sessions/{id}/cancel:
    post:
      tags: [assessment]
      summary: Abandon an attempt
      operationId: cancelAttempt
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Cancelled }
        "409":
          description: Already closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/organizations:
    get:
      tags: [institutions]
      summary: Organisations the caller belongs to
      description: Each entry carries the caller's own membership role, so the list doubles as "what may I do here".
      operationId: listOrganizations
      responses:
        "200": { description: Organisations }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [institutions]
      summary: Register an organisation
      description: |
        The caller becomes the organisation's owner — scoped to that organisation and recorded as an
        auditable membership. No platform-wide role is granted: authority inside an institution comes
        from membership, never from a role chosen at signup.

        The organisation starts `pending_verification` and a platform administrator approves it. A
        verified email is required, because there must be a reachable person responsible for it.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3 }
                kind: { type: string, enum: [school, centre, ngo, company], default: school }
      responses:
        "201":
          description: Organisation created, unverified
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The caller's email address is not verified (`EMAIL_NOT_VERIFIED`)

  /v1/organizations/{id}:
    get:
      tags: [institutions]
      summary: One organisation
      description: Members only. A non-member receives 404 rather than 403, so the endpoint cannot be used to enumerate organisations.
      operationId: getOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organisation
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organizations/{id}/classes:
    get:
      tags: [organizations]
      summary: An institution's classes
      description: |
        Owner or administrator only. Belonging to an institution is not the same as running it, so a
        student member gets `403`.

        Only classes explicitly created inside the institution appear here: a teacher's personal class
        is theirs, not the institution's, whatever their employment.
      operationId: listOrganizationClasses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Institution classes with member and assignment counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items: { $ref: "#/components/schemas/Class" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organizations/{id}/members:
    get:
      tags: [institutions]
      summary: Membership roster
      description: Owners and administrators only — a roster contains other people's contact details.
      operationId: listOrganizationMembers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/organizations/{id}/members/{userId}:
    delete:
      tags: [institutions]
      summary: Remove a member (or leave)
      description: |
        Ends the membership and, in the same transaction, the access it carried — including the global
        teacher role when no other organisation still grants it. An administrator cannot remove a peer
        or a superior; anyone may leave on their own behalf. The last owner cannot be removed.
      operationId: removeOrganizationMember
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Membership ended }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The organisation would be left without an owner

  /v1/organizations/{id}/invitations:
    get:
      tags: [institutions]
      summary: Invitations issued by an organisation
      description: Owners and administrators. Tokens are never listed — only the state of each invitation.
      operationId: listOrganizationInvitations
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [institutions]
      summary: Invite someone into an organisation
      description: |
        Creates a single-use, email-locked invitation valid for seven days and returns its token once.
        The token is stored as a hash, so a database reader cannot use one. Any earlier open invitation
        for the same address is superseded. Ownership is never invitable.
      operationId: createOrganizationInvitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, teacher, student], default: teacher }
      responses:
        "201":
          description: Invitation created; the token is returned only here
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  token:
                    type: string
                    description: Opaque invitation token. Deliver it; do not log or store it client-side.
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: That person is already a member }

  /v1/organizations/{id}/invitations/{invitationId}:
    delete:
      tags: [institutions]
      summary: Withdraw an invitation
      description: The link stops working immediately. Distinct from expiry, which happens on its own.
      operationId: revokeOrganizationInvitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Invitation withdrawn }
        "404": { description: No open invitation with that id }

  /v1/organizations/invitations/accept:
    post:
      tags: [institutions]
      summary: Accept an invitation
      description: |
        The token must be live, have uses left, and have been addressed to the signed-in account.
        A teacher invitation is a deliberate grant by an owner, so it confers the platform teacher role;
        admin and student invitations confer nothing global.
      operationId: acceptOrganizationInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined: { type: boolean }
                  organization: { $ref: "#/components/schemas/Organization" }
        "403": { description: The invitation was addressed to a different account }
        "404": { description: The token is not valid }
        "409": { description: Already used, revoked or expired }

  /v1/admin/organizations/{id}/verify:
    post:
      tags: [institutions]
      summary: Approve an organisation
      description: Platform administrators only. An institution vouching for itself is not verification.
      operationId: verifyOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already verified }

  /v1/classes:
    get:
      tags: [classroom]
      summary: Classes this user belongs to
      operationId: listClasses
      responses:
        "200": { description: Classes }
    post:
      tags: [classroom]
      summary: Create a class
      description: |
        Two permissions reach this endpoint, and they are deliberately different.

        A **personal** class (no `organizationId`) needs a teaching capability: the caller must hold the
        `teacher`, `org_admin` or `platform_admin` role.

        An **institution** class needs authority inside that institution — an `owner` or `admin`
        membership. A principal who has never taught may create their school's classes; a teacher who
        belongs to another institution may not, and is told the institution was not found rather than
        being told it exists.
      operationId: createClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                subjectId: { type: string }
                organizationId:
                  type: string
                  description: Attach the class to an institution. The caller must own or administer it.
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/join:
    post:
      tags: [classroom]
      summary: Join a class with a code
      operationId: joinClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { description: Joined }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/classes/{id}/roster:
    get:
      tags: [classroom]
      summary: Class roster
      description: Teacher of that class, or a platform admin. Never "any staff member".
      operationId: classRoster
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Roster }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/classes/{id}/assignments:
    get:
      tags: [classroom]
      summary: Published assessments for a class
      operationId: classAssignments
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Assignments }

  /v1/products:
    get:
      tags: [commerce]
      summary: Store products
      operationId: listProducts
      responses:
        "200":
          description: Products with integer minor-unit prices
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }

  /v1/orders:
    get:
      tags: [commerce]
      summary: Own orders
      operationId: listOrders
      responses:
        "200": { description: Orders }
    post:
      tags: [commerce]
      summary: Create an order and a payment intent
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        "201": { description: Order created (status pending) }
        "403":
          description: |
            The account's email address has not been verified. Purchases are refused until it is:
            a receipt and a refund both need a mailbox the platform can actually reach.
            Error code `EMAIL_NOT_VERIFIED`.

  /v1/orders/{id}:
    get:
      tags: [commerce]
      summary: One order
      description: Status only becomes paid after a verified provider webhook.
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Order }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/orders/{id}/simulate-payment:
    post:
      tags: [commerce]
      summary: Send a signed sandbox webhook (development only)
      description: |
        Present only when `EDUMART_ALLOW_SANDBOX_PAYMENTS=true`. It posts a real HMAC-signed webhook
        to the same handler production uses, so the paid path is exercised end to end — it does not
        flip the order status directly.
      operationId: simulatePayment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Webhook accepted }
        "404": { description: Disabled in this environment }

  /v1/webhooks/payments/{provider}:
    post:
      tags: [commerce]
      summary: Payment provider callback
      description: |
        Authenticated by HMAC-SHA256 over the raw body in `X-Edumart-Signature`, never by session.
        Provider event ids are unique, so a replayed callback returns `{ "duplicate": true }` and
        grants nothing twice. Amount and currency are verified against the order.
      operationId: paymentWebhook
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [sandbox, paystack] }
        - name: X-Edumart-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, orderId, amountMinor, currency]
              properties:
                eventId: { type: string }
                orderId: { type: string }
                amountMinor: { type: integer }
                currency: { type: string, default: NGN }
      responses:
        "200":
          description: Processed or already processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
        "401":
          description: Missing or invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/library:
    get:
      tags: [commerce]
      summary: Entitlements granted by paid orders
      operationId: getLibrary
      responses:
        "200": { description: Library }

  /v1/rewards:
    get:
      tags: [rewards]
      summary: Points balance and ledger
      description: Learn points are a separate append-only ledger from commission.
      operationId: getRewards
      responses:
        "200":
          description: Rewards
          content:
            application/json:
              schema:
                type: object
                properties:
                  rewards:
                    type: object
                    properties:
                      pointsBalance: { type: integer }
                      entries:
                        type: array
                        items:
                          type: object

  /v1/rewards/redeem:
    post:
      tags: [rewards]
      summary: Redeem points
      operationId: redeemPoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: integer, minimum: 1 }
      responses:
        "200": { description: Redeemed }
        "409":
          description: Insufficient balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/referrals/me:
    get:
      tags: [rewards]
      summary: Own referral code and qualification
      operationId: getMyReferral
      responses:
        "200": { description: Referral }

  /v1/support-cases:
    post:
      tags: [staff]
      summary: Open a support case
      operationId: openSupportCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string }
                message: { type: string }
                questionVersionId: { type: string }
      responses:
        "201": { description: Case opened }

  /v1/admin/deliveries:
    get:
      tags: [operations]
      summary: Recent outbound messages and delivery health
      description: |
        Every verification code, reset link and invitation is recorded before it is attempted, then
        retried on a backoff until it succeeds or is abandoned. This endpoint is how "the emails are
        not arriving" gets answered without opening a provider dashboard.

        Message bodies are never returned: an operator needs to know a message failed, not to read the
        credential it carried. Bodies are cleared from the queue as soon as a message is delivered or
        abandoned, so the queue is not a second copy of user inboxes.
      operationId: listDeliveries
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/Delivery" }
                  stats: { $ref: "#/components/schemas/DeliveryStats" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/review-queue:
    get:
      tags: [staff]
      summary: Content awaiting review
      operationId: reviewQueue
      responses:
        "200": { description: Queue }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/question-versions/{id}/review:
    post:
      tags: [staff]
      summary: Approve or reject a question version
      operationId: reviewQuestionVersion
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string }
      responses:
        "200": { description: Recorded }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/metrics:
    get:
      tags: [staff]
      summary: Operations metrics
      operationId: adminMetrics
      responses:
        "200": { description: Metrics }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/cases:
    get:
      tags: [staff]
      summary: Support cases
      operationId: adminCases
      responses:
        "200": { description: Cases }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/cases/{id}/resolve:
    post:
      tags: [staff]
      summary: Resolve a support case
      operationId: resolveCase
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Resolved }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: edumart_session
    bearerSession:
      type: http
      scheme: bearer

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    QuestionVersionId:
      name: qvId
      in: path
      required: true
      schema: { type: string }
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: { type: string }

  responses:
    ValidationError:
      description: One or more fields are invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests; `Retry-After` is set
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - SESSION_EXPIRED
                - SESSION_CLOSED
                - ASSESSMENT_CLOSED
                - RATE_LIMITED
                - INTERNAL
            message: { type: string }
            request_id: { type: string }
            details:
              oneOf:
                - type: array
                  items:
                    type: object
                    properties:
                      field: { type: string }
                      message: { type: string }
                - type: object
                  additionalProperties: true

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string }
        examPathwayId: { type: [string, "null"] }
        targetDate: { type: [string, "null"] }
        timezone: { type: string }
        dailyMinutes: { type: integer }
        roles:
          type: array
          items: { type: string }
        onboardingStep: { type: integer }
        phone:
          type: [string, "null"]
          description: E.164 number on file, verified or not.
        emailVerified:
          type: boolean
          description: True only after a code sent to the address was confirmed.
        phoneVerified: { type: boolean }

    Class:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        subjectId: { type: string, nullable: true }
        organizationId:
          type: string
          nullable: true
          description: The institution that owns the class; null for a teacher's personal class.
        joinCode: { type: string }
        role: { type: string, enum: [teacher, student] }
        members: { type: integer }
        assignments: { type: integer }
        createdAt: { type: string, format: date-time }

    Delivery:
      type: object
      description: One outbound message. The body is deliberately absent.
      properties:
        id: { type: string }
        channel: { type: string, enum: [email, phone] }
        recipient: { type: string }
        template: { type: string, example: verify_email }
        subject: { type: string }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lastError:
          type: string
          description: The provider's last complaint, truncated. Empty once the message is delivered.
        resourceType: { type: string, enum: ["", verification_code, password_reset_token] }
        resourceId: { type: string }
        createdAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        sentAt: { type: string }

    DeliveryStats:
      type: object
      properties:
        sent: { type: integer }
        pending: { type: integer }
        failed: { type: integer }

    Organization:
      type: object
      required: [id, name, slug, kind, status, verified, role]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [school, centre, ngo, company] }
        status: { type: string, enum: [pending_verification, active, suspended] }
        verified: { type: boolean }
        verifiedAt: { type: string }
        role:
          type: string
          enum: [owner, admin, teacher, student, platform_admin]
          description: The caller's own membership role; `platform_admin` when access is administrative.
        members: { type: integer }
        classes: { type: integer }
        createdAt: { type: string, format: date-time }

    OrganizationMember:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, teacher, student] }
        status: { type: string }
        joinedAt: { type: string, format: date-time }

    Invitation:
      type: object
      description: An offer of membership. The token is returned once, at creation, and never listed.
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, teacher, student] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        maxUses: { type: integer }
        useCount: { type: integer }

    SessionIssued:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Opaque session token. The web app never reads it (httpOnly cookie).
        expires_at: { type: string, format: date-time }
        next: { type: string }
        user: { $ref: "#/components/schemas/User" }

    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
        examPathwayId: { type: [string, "null"] }
        targetDate: { type: [string, "null"], format: date }
        subjectIds:
          type: array
          items: { type: string }
        dailyMinutes: { type: integer }
        referralCode: { type: string }
        timezone: { type: string, default: Africa/Lagos }
        client: { type: string, enum: [web, mobile] }
        onboardingStep: { type: integer }

    SignupDraftResponse:
      type: object
      properties:
        draft:
          type: [object, "null"]
          properties:
            examPathwayId: { type: string }
            examPathwayKey: { type: string }
            subjectIds:
              type: array
              items: { type: string }
            targetDate: { type: string }
            dailyMinutes: { type: integer }
            displayName: { type: string }
            email: { type: string }
            timezone: { type: string }
        step:
          type: [string, "null"]
          enum: [pathway, subjects, schedule, account, confirm, null]
        stepIndex: { type: integer }
        referralCode: { type: string }
        token:
          type: string
          description: Returned only on creation.

    Readiness:
      type: object
      required: [status, time, driver, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        time: { type: string, format: date-time }
        driver: { type: string }
        request_id: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string, enum: [database, migrations] }
              status: { type: string, enum: [ok, fail] }
              detail: { type: string }
              latency: { type: string }

    SessionView:
      type: object
      required: [id, client, createdAt, expiresAt, current]
      properties:
        id:
          type: string
          description: Hash of the session token; not usable as a credential.
        client: { type: string, enum: [web, mobile] }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current:
          type: boolean
          description: True for the session that authenticated this request.

    Subject:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        topics: { type: integer }

    Option:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        text: { type: string }

    Question:
      type: object
      description: |
        Answer key fields are absent until `result_released`. They are not sent as null, so a client
        cannot distinguish "hidden" from "empty" and cache a wrong assumption.
      properties:
        qvId: { type: string }
        stem: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/Option" }
        position: { type: integer }
        topicName: { type: string }
        subjectName: { type: string }
        difficulty: { type: string }
        selectedOptionId: { type: [string, "null"] }
        answerVersion: { type: integer }

    ReviewItem:
      type: object
      properties:
        qvId: { type: string }
        answerOptionId: { type: string }
        explanation: { type: string }
        topicName: { type: string }
        topicId: { type: string }
        difficulty: { type: string }

    Score:
      type: object
      properties:
        raw: { type: integer }
        max: { type: integer }
        percent: { type: integer }
        policyVersion: { type: integer }

    AssessmentSession:
      type: object
      required: [session_id, mode, status, deadline_at, server_time, remaining_seconds]
      properties:
        session_id: { type: string }
        mode: { type: string, enum: [practice, mock, assignment] }
        status: { type: string, enum: [in_progress, submitted, expired, cancelled] }
        attempt_no: { type: integer }
        started_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        server_time:
          type: string
          format: date-time
          description: Render the countdown from this, not from the device clock.
        question_count: { type: integer }
        remaining_seconds: { type: integer }
        result_released: { type: boolean }
        questions:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        score:
          oneOf:
            - $ref: "#/components/schemas/Score"
            - type: "null"
        review:
          type: array
          items: { $ref: "#/components/schemas/ReviewItem" }

    SaveResult:
      type: object
      required: [saved, server_saved_at, version, session_status]
      properties:
        saved: { type: boolean }
        server_saved_at: { type: string, format: date-time }
        version: { type: integer }
        session_status: { type: string }
        remaining_seconds: { type: integer }

    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceMinor:
          type: integer
          description: Minor units (kobo). ₦1,200 is 120000.
        currency: { type: string, default: NGN }
        kind: { type: string }

security:
  - sessionCookie: []
  - bearerSession: []
