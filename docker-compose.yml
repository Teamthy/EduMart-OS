services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edumart
      POSTGRES_USER: edumart
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - edumart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumart -d edumart"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - edumart_redisdata:/data
volumes:
  edumart_pgdata:
  edumart_redisdata:
