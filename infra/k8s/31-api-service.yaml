apiVersion: v1
kind: Service
metadata:
  name: edumart-api
  namespace: edumart
  labels:
    app.kubernetes.io/name: edumart-api
    app.kubernetes.io/part-of: edumart
spec:
  # ClusterIP: the API is never exposed directly. Traffic reaches it through the web proxy, which is what
  # keeps the session cookie first-party and means there is one origin to secure.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edumart-api
  ports:
    - name: http
      port: 8080
      targetPort: http
