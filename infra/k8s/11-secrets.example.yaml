# The shape of the secret this deployment needs — **placeholders, not a secret**.
#
# Create the real one out of band, so it never passes through a git object:
#
#   kubectl -n edumart create secret generic edumart-secrets \
#     --from-literal=EDUMART_DSN='postgres://edumart:PASSWORD@db:5432/edumart?sslmode=verify-full' \
#     --from-literal=EDUMART_VERIFICATION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=EDUMART_WEBHOOK_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=EDUMART_METRICS_TOKEN="$(openssl rand -base64 48)" \
#     --from-literal=EDUMART_PAYSTACK_SECRET_KEY='sk_live_…' \
#     --from-literal=EDUMART_SMTP_USERNAME='…' \
#     --from-literal=EDUMART_SMTP_PASSWORD='…'
#
# `scripts/check-manifests.py` fails if this file contains anything that is not obviously a placeholder, and
# it fails if the Deployment references a key this list does not have.
apiVersion: v1
kind: Secret
metadata:
  name: edumart-secrets
  namespace: edumart
type: Opaque
stringData:
  EDUMART_DSN: REPLACE_ME_dsn
  EDUMART_VERIFICATION_SECRET: REPLACE_ME_verification_secret
  EDUMART_WEBHOOK_SECRET: REPLACE_ME_webhook_secret
  EDUMART_METRICS_TOKEN: REPLACE_ME_metrics_token
  EDUMART_PAYSTACK_SECRET_KEY: REPLACE_ME_paystack_secret_key
  EDUMART_SMTP_USERNAME: REPLACE_ME_smtp_username
  EDUMART_SMTP_PASSWORD: REPLACE_ME_smtp_password
