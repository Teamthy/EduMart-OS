# Default deny, then the four flows that actually exist. Without this, anything in the cluster can reach the
# API, and the "the API is internal" claim is a diagram rather than a rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: edumart
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-web-and-monitoring
  namespace: edumart
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edumart-api
  policyTypes: ["Ingress"]
  ingress:
    # The web proxy is the only application path to the API.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edumart-web
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus scrapes /metrics from its own namespace. The token on /metrics is the second lock.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
  namespace: edumart
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edumart-web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
