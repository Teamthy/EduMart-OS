# Non-secret configuration. Everything here is safe to read with `kubectl get configmap -o yaml`, which is
# exactly the test: if a value would be damaging in a support ticket, it belongs in 11-secrets.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edumart-config
  namespace: edumart
data:
  # PostgreSQL is the production system of record. SQLite is a development convenience: one file, one
  # process, and no way to run a fleet against it.
  EDUMART_DRIVER: postgres
  EDUMART_ENV: production
  # Demo fixtures must never be written to a real database. The Job and the Deployment both set this.
  EDUMART_SEED: "false"
  EDUMART_SEED_DEMO_USERS: "false"
  # The web origin, which is also what links in invitation emails point at.
  EDUMART_WEB_URL: https://edumart.ng
  EDUMART_ALLOWED_ORIGINS: https://edumart.ng
  # Requests arrive through the web proxy, so the client address only exists in X-Forwarded-For. Without
  # this every learner shares one rate-limit bucket and password guessing becomes a loop.
  EDUMART_TRUST_PROXY: "true"
  EDUMART_NOTIFY: smtp
  EDUMART_SMTP_HOST: smtp.postmarkapp.com
  EDUMART_SMTP_PORT: "587"
  EDUMART_SMTP_TLS: starttls
  EDUMART_SMTP_FROM: no-reply@edumart.ng
  EDUMART_SMTP_ALLOW_INSECURE: "false"
  EDUMART_PAYMENT_PROVIDER: paystack
  # Sandbox payments are an acceptance-test path that credits an account without money. Off in production.
  EDUMART_ALLOW_SANDBOX_PAYMENTS: "false"
  # An hour, not a week. Clients renew with the single-use refresh token, so a stolen access token is a
  # bounded problem rather than a seven-day one.
  EDUMART_ACCESS_TOKEN_TTL: 1h
  # Migrations are a deploy step (`-migrate-only`, run by the Job), never a boot side effect. Replicas verify
  # the ledger instead, so exactly one process ever changes the schema during a rollout.
  EDUMART_MIGRATE_ON_BOOT: "false"
  # Referral commission by level: direct referrer, their referrer, and one more. Depth is a configuration
  # decision because every extra level pays somebody with no relationship to the customer.
  EDUMART_REFERRAL_RATES: "10,3,1"
  # Recordings of live classes. The directory is the switch: with it unset the recording endpoints answer 503 with the
  # reason, which is honest, and with it set but unwritable the process refuses to start, which is safer than a host
  # recording an hour of a class into a void. The bytes stored here are sealed in the browser, so this volume holds
  # ciphertext the API cannot open.
  EDUMART_MEDIA_DIR: "/var/lib/edumart/media"
  # A recording is erased on this clock, counted from when it started, and the date is shown to the class before the
  # first chunk is uploaded. Thirty days is long enough to revise from and short enough that a forgotten recording is
  # not kept forever.
  EDUMART_RECORDING_RETENTION_DAYS: "30"
  # 8 MiB per chunk: a few seconds of 720p, small enough that a dropped upload costs seconds rather than a minute.
  EDUMART_RECORDING_SEGMENT_BYTES: "8388608"
  # 2 GiB per recording, so one class cannot fill the volume and take the next class down with it.
  EDUMART_RECORDING_MAX_BYTES: "2147483648"
  # ICE servers for live classes, as the JSON a browser passes to RTCPeerConnection. STUN alone gets most home
  # networks connected; peers behind a symmetric NAT need a TURN relay, which is bandwidth an operator pays
  # for, so it is configured here rather than assumed. Credentials belong in 11-secrets.
  EDUMART_ICE_SERVERS: '[{"urls":["stun:stun.l.google.com:19302"]}]'
  # The self-hosted TURN relay. It is **off unless EDUMART_TURN_SECRET exists in the Secret**: an
  # unauthenticated relay is an open proxy on the operator's bandwidth, so the secret is the switch.
  # PUBLIC_IP is the address a browser is told to send to and must be the one traffic actually arrives on;
  # a relay advertising an unreachable address is worse than no relay, because the client waits for media
  # that will never come. The UDP port below must be exposed outside the cluster — a ClusterIP Service
  # cannot carry it, so a deployment either runs this behind a UDP LoadBalancer/NodePort on 3478 or points
  # EDUMART_ICE_SERVERS at a hosted relay instead.
  EDUMART_TURN_LISTEN: 0.0.0.0:3478
  EDUMART_TURN_PUBLIC_IP: turn.edumart.ng
  EDUMART_TURN_REALM: edumart
  # Credentials are minted per participant and expire; one hour covers the longest class with room to spare.
  EDUMART_TURN_TTL_MINUTES: "60"
  EDUMART_MIGRATION_LOCK_TIMEOUT: 60s
