# The staging Secret, with values that are placeholders for a rehearsal and nothing else.
#
# `11-secrets.example.yaml` is deliberately not part of this overlay: it exists to be read and copied into a real
# cluster by hand. A rehearsal needs a Secret that *works*, so this one is committed — and every value below says so
# in its own words, because the failure mode of a committed Secret is somebody later treating it as a credential.
#
# `scripts/scan-secrets.py` runs over this repository on every pull request and would fail on anything shaped like a
# live key. These are not: no provider key, no mail password, and a database password that only exists in the
# fixture above.
apiVersion: v1
kind: Secret
metadata:
  name: edumart-secrets
  namespace: edumart
type: Opaque
stringData:
  # The rehearsal's own PostgreSQL, which lives and dies with the cluster. No password in this URL because the
  # fixture authenticates on `trust` — see postgres.yaml for why that is the honest choice here rather than a
  # password committed into a repository and scanned for by `scripts/scan-secrets.py`.
  EDUMART_DSN: postgres://edumart@postgres-staging.edumart.svc.cluster.local:5432/edumart?sslmode=disable
  # Every other value is a literal that says what it is. They are long enough for the API's own minimums and are
  # never used outside this overlay: sessions, webhook signatures and TURN credentials signed with a published
  # string are worth exactly nothing.
  EDUMART_VERIFICATION_SECRET: staging_only_verification_secret_not_a_credential
  EDUMART_WEBHOOK_SECRET: staging_only_webhook_secret_not_a_credential
  EDUMART_METRICS_TOKEN: staging_only_metrics_token_not_a_credential
