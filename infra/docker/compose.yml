# Local dependencies for the production-shaped path.
#
#   docker compose -f infra/docker/compose.yml up -d
#
# The API's default and CI-tested driver is SQLite (`EDUMART_DRIVER=sqlite3`, a file on disk), so
# nothing here is needed to run the product locally. This file exists for the two things SQLite
# cannot stand in for:
#
#   postgres — the production system of record. Fully supported: `EDUMART_DRIVER=postgres`, and the
#              whole test suite plus the HTTP smoke journey run against it in CI.
#   redis    — reserved for cross-instance rate limiting and background jobs. The API does not talk
#              to it today: rate limiting is in-process.
#   mailpit  — a local SMTP relay with a web inbox, so verification emails can be read without a
#              provider. Start it with `--profile mail` and set:
#                EDUMART_NOTIFY=smtp EDUMART_SMTP_HOST=127.0.0.1 EDUMART_SMTP_PORT=1025
#                EDUMART_SMTP_FROM=no-reply@edumart.ng EDUMART_SMTP_TLS=none
#                EDUMART_SMTP_ALLOW_INSECURE=true
#
# Credentials below are local-only and must never be reused anywhere real.

name: edumart

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edumart
      POSTGRES_USER: edumart
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - edumart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumart -d edumart"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - edumart_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Local inbox: accepts everything, shows it at http://localhost:8025. Never for real users.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox

volumes:
  edumart_pgdata:
  edumart_redisdata:
